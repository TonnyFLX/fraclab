<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FracLab · Juego de fracciones</title>
<style>
:root{--ink:#1f2a44;--muted:#5d6b8a;--bg1:#eaf3ff;--bg2:#f6efff;--card:#fff;--primary:#5b4bdb;--primary-d:#4538b8;
--teal:#14b8a6;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--line:#d9e1f2}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
#app{max-width:980px;margin:0 auto;padding:16px}
#app.wide{max-width:1200px}
h1,h2,h3{margin:.2em 0}
.card{background:var(--card);border-radius:20px;box-shadow:0 6px 24px rgba(40,50,110,.12);padding:22px;margin:12px 0}
.center{text-align:center;max-width:420px;margin:40px auto}
.logo{font-size:44px;letter-spacing:-1px}.logo span{color:var(--primary)}
.muted{color:var(--muted)}
label{display:block;text-align:left;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #b7aefc}
.btn{font-size:18px;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:#eef1fb;color:var(--ink)}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-d)}
.btn.big{font-size:22px;padding:14px 26px;width:100%;margin-top:14px}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);font-size:16px;cursor:pointer;margin:10px 8px 0;text-decoration:underline}
.err{color:var(--bad);min-height:1.4em;margin-top:8px;font-weight:600}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 8px rgba(40,50,110,.1)}
.bar{height:12px;background:#dfe6f7;border-radius:99px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--primary));width:0;transition:width .3s}
.tbar{position:relative;height:24px;background:#dfe6f7;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.tbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--teal)}
.tbar i.low{background:var(--bad)}
.tbar span{position:absolute;right:12px;top:0;font-size:14px;font-weight:800;line-height:24px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{border:3px solid var(--line);border-radius:18px;padding:16px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.mode:hover{border-color:var(--primary)}
.mode .ic{font-size:34px}.mode b{display:block;font-size:20px;margin:4px 0}
.mode.locked{opacity:.55;cursor:default;background:#f4f6fb}.mode.locked:hover{border-color:var(--line)}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.lvl{border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:17px;color:var(--ink)}
.lvl.on{border-color:var(--primary);background:#eeeaff;color:var(--primary-d)}
.prompt{font-size:26px;font-weight:700;text-align:center;margin:4px 0 10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .15em}
.frac .n{padding:0 .3em;border-bottom:.09em solid currentColor}.frac .d{padding:0 .3em}
.frac.xl{font-size:56px}.frac.lg{font-size:40px}
.mixw{font-weight:800;vertical-align:middle;margin-right:.1em}
.mixw.xl{font-size:84px}.mixw.lg{font-size:60px}
.stage{display:flex;justify-content:center}
canvas{width:100%;max-width:640px;aspect-ratio:2/1;background:#fbfcff;border:2px solid var(--line);border-radius:16px;touch-action:manipulation;cursor:pointer}
canvas.cls{max-width:1100px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.opt{font-size:30px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;cursor:pointer;color:var(--ink);position:relative}
.opt:hover{border-color:var(--primary)}
.opt .k{position:absolute;left:8px;top:4px;font-size:12px;color:var(--muted);font-weight:700}
.opt.right{background:#dcfce7;border-color:var(--ok)}.opt.wrong{background:#fee2e2;border-color:var(--bad)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row.left{justify-content:flex-start}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:20px;text-align:center}
.fb.good{background:#dcfce7;border:2px solid var(--ok)}.fb.bad{background:#fee2e2;border:2px solid var(--bad)}
.hidden{display:none}
.stars{font-size:52px;letter-spacing:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{background:#f3f5fc;position:sticky;top:0}
tr.st{cursor:pointer}tr.st:hover{background:#f7f5ff}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:13px;font-weight:700}
.badge.high{background:#fee2e2;color:#991b1b}.badge.med{background:#fef3c7;color:#92400e}.badge.ok{background:#dcfce7;color:#166534}
.scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.prompt{font-size:21px}.frac.xl{font-size:44px}.mixw.xl{font-size:64px}}
.pop{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:8px 18px;border-radius:99px;font-weight:800;font-size:22px;animation:pop .9s forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.small{font-size:14px}
/* modo clase */
.shapes{display:flex;gap:8px;flex-wrap:wrap}
.shp{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:17px;color:var(--ink)}
.shp.on{border-color:var(--primary);background:#eeeaff;color:var(--primary-d)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.ctl label{margin:0 0 4px;font-size:15px}
.ctl input[type=number]{font-size:26px;font-weight:800;text-align:center}
.ctl input:disabled{background:#f1f3f9;color:#9aa4bd}
.who{min-height:26px;margin-top:8px;font-size:20px;font-weight:800;color:var(--ok)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:600;margin:0;cursor:pointer}
.chk input{width:20px;height:20px}
.fraclabel{text-align:center;min-height:90px;margin-bottom:6px}
.statrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.statrow .nm{width:190px;font-weight:600;font-size:15px}
.statrow .meter{flex:1;height:14px;background:#e4e9f7;border-radius:99px;overflow:hidden}
.statrow .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--primary))}
.statrow .val{width:110px;text-align:right;font-size:14px;color:var(--muted)}
.mtab{display:inline-block;padding:10px 16px;background:#fbfcff;border:2px solid var(--line);border-radius:16px}
.mrow{display:flex;align-items:center}
.mc{width:68px;height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.mrow.first .mc{border-bottom:3px solid var(--ink)}
.mc.one span{display:inline-flex;width:40px;height:40px;border:3px solid var(--bad);border-radius:50%;align-items:center;justify-content:center}
.mc input{width:60px;height:46px;font-size:24px;text-align:center;padding:0;font-weight:700}
.mc input.bad{border-color:var(--bad);background:#fee2e2}.mc input.good{border-color:var(--ok);background:#dcfce7}
.mdiv{min-width:76px;height:56px;border-left:3px solid var(--ink);margin-left:6px;padding-left:16px;display:flex;align-items:center;font-size:28px;font-weight:800;color:var(--primary-d)}
.mtab.xl .mc{width:100px;height:80px;font-size:46px}.mtab.xl .mc.one span{width:60px;height:60px}
.mtab.xl .mdiv{height:80px;min-width:110px;font-size:46px}
.pbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pbtn{font-size:28px;font-weight:800;width:72px;height:60px;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.pbtn:hover{border-color:var(--primary)}.pbtn.hint{border-color:var(--warn);background:#fef3c7}
.mmsg{min-height:30px;font-size:18px;font-weight:600;text-align:center;margin-top:10px}
.mmsg.bad{color:var(--bad)}.mmsg.good{color:var(--ok)}.mmsg.tip{color:var(--primary-d)}
.mstage{display:flex;justify-content:center;margin:10px 0}
.mformula{font-size:26px;font-weight:700;text-align:center}.mformula input{width:110px;font-size:26px;text-align:center;display:inline-block}
.mformula.big{font-size:38px;min-height:52px}
.chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 2px;margin:10px 0 14px;min-height:100px}
.chain .eq{font-size:34px;font-weight:800;margin:0 .3em;color:var(--muted)}
.sf{display:inline-flex;align-items:stretch}
.sf .dv{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:16px;color:#db2777;margin-left:4px;padding:3px 0}
.fbox{border:4px solid var(--ok);border-radius:14px;background:#f0fdf4;padding:4px 12px;display:inline-flex;align-items:center}
.fbox.num{font-size:40px;font-weight:800}
.frac .n input{width:96px;height:50px;font-size:30px;text-align:center;padding:0;font-weight:800}
.sstop{font-size:20px;padding:12px 22px;margin-top:12px}
.modal .box.alertbox{max-width:560px;max-height:94vh;overflow:auto;border:6px solid var(--bad);background:#fff5f5;animation:shake .5s}
.modal .box.alertbox.win{border-color:var(--ok);background:linear-gradient(180deg,#ecfdf5,#fff);animation:pop .4s}
.alertbox .aicon{font-size:76px;line-height:1.1;animation:pulse .55s infinite alternate}
.alertbox.win .aicon{animation:bounce .9s infinite}
.alertbox h2{margin:4px 0 10px;font-size:30px}.alertbox.bad h2{color:var(--bad)}.alertbox.win h2{color:var(--ok)}
.modal .alertbox .abody p{font-size:19px;margin:8px 0;font-weight:600}
.modal .alertbox .abody p.aline{font-size:22px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.modal .alertbox .abody p.atip{background:#fef3c7;border-radius:12px;padding:10px 12px}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.2)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.modal .box.alertbox,.alertbox .aicon{animation:none}}
.lfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px}
.lfrac .ln{display:flex;align-items:center;gap:8px;padding:6px 16px;border-bottom:5px solid var(--ink)}
.lfrac .ld{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.lfrac .ld small{font-size:15px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;line-height:1}
.nbox{display:inline-block;min-width:54px;text-align:center;border:3px solid var(--ink);border-radius:8px;padding:0 10px;font-size:34px;font-weight:800;background:#fff}
.lfrac .ld .nbox{border-color:var(--teal);color:#0f766e}
.stps{text-align:center;margin:4px 0 8px}
.stp{display:inline-block;padding:5px 12px;border-radius:99px;background:#eef1fb;color:var(--muted);font-weight:700;margin:2px;font-size:14px}
.stp.on{background:var(--primary);color:#fff}.stp.ok{background:#dcfce7;color:var(--ok)}
.ain{font-size:26px;height:48px;text-align:center;font-weight:800;padding:0;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.ain.bad{border-color:var(--bad);background:#fee2e2}.ain.good{border-color:var(--ok);background:#dcfce7}
.trow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;margin:10px 0;font-size:28px;font-weight:700}
.op{display:inline-block;font-size:30px;font-weight:800;color:var(--primary-d);background:#eeeaff;border-radius:12px;padding:0 12px}
.modal{position:fixed;inset:0;background:rgba(31,42,68,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .box p{font-size:20px;margin:0 0 6px;font-weight:600}
.modal .row{margin-top:18px}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:50%;background:var(--ok)}.dots i.x{background:var(--bad)}.dots i.t{background:var(--warn)}
#demotools{position:fixed;right:10px;bottom:10px;z-index:50;display:flex;gap:6px;align-items:center;background:#1f2a44;color:#fff;border-radius:99px;padding:6px 10px;font-size:13px;opacity:.9;zoom:1}
#demotools button{background:#fff;color:#1f2a44;border:0;border-radius:99px;padding:5px 10px;font-weight:800;cursor:pointer}
#democfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff7d6;border:2px dashed #e0b400;border-radius:14px;padding:8px 12px;margin-bottom:10px}
#democfg .cfg{font-size:20px;font-weight:800;text-align:center;border:2px solid #d3d9ea;border-radius:10px;padding:6px 2px}
#democfg .cfr{display:inline-flex;align-items:center;gap:4px}
#democfg .cst{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
#democfg .cst i{display:block;width:100%;height:3px;background:#1f2a44;border-radius:2px}
#democfg .cplus{font-size:26px;font-weight:900;color:#5a6384}
#cloudst{position:fixed;left:10px;bottom:10px;z-index:40;background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(40,50,110,.18);color:#166534}
#cloudst.warn{color:#92400e;background:#fef3c7}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   FracLab v0.8 — juego de fracciones (un solo archivo, sin dependencias)

   v0.8: Paso 3 del reto Suma con una sola línea larga (numeradores arriba, mcm abajo), como en el pizarrón.
   v0.7: reto «Suma» con distinto denominador (simplificar → mcm → plantilla → sumar), 3 niveles de 5 ejercicios.
   v0.6: alertas grandes con sirena (primo incorrecto) y de victoria (fracción irreducible) que explican el porqué; pausan el reloj.
   v0.5: reto «Simplifica» (simples y mixtas, por números primos), 3 niveles de 10 intentos.
   v0.4: lista de alumnos, música chiptune, MCM en 3 niveles.
   v0.3: reto «Mínimo común múltiplo» (descomposición simultánea en tabla)
   y su versión para proyectar paso a paso en el MODO CLASE.

   NOVEDADES v0.2
   · MODO CLASE (docente): eliges la figura (círculo, cuadrado, rectángulo,
     pastel, pizza, barra de chocolate), el tipo de fracción (propia,
     impropia, mixta) y escribes enteros, numerador y denominador; el
     programa dibuja las figuras necesarias y las colorea.
   · MODO JUEGO: temporizador por pregunta, figuras variadas según el nivel,
     y estadísticas (del alumno y para el docente).

   HISTORIAL DE VERSIONES
     1.0.0  FracLab en la nube (Supabase + GitHub Pages). Acceso del alumno con código de grupo +
            número de lista + NIP de 4 dígitos (sin nombres ni CURP). Cada intento se guarda en
            la nube; sin internet queda en cola y se envía al volver la conexión. Zona docente con
            inicio de sesión real: códigos de grupo, resumen por grupo, quién no ha practicado,
            reinicio de NIP y exportación CSV. Se retira la capacidad «downloads» de claude.ai.
     0.11   Modo docente: casillas entero / numerador / denominador para fijar mis fracciones.
     0.10   Modo docente con ejercicios propios.   0.9  Modo docente juega como los alumnos.
     0.8    Suma: paso 3 con la línea larga y el mcm debajo.   0.7  Reto Suma (distinto denominador).
     0.6    Alertas grandes (sirena / victoria) en Simplifica.   0.5  Reto Simplifica.
     0.4    Lista de alumnos, 3 niveles × 5 intentos en MCM, música estilo chiptune.
     0.1–0.3  Modo clase, modo juego, figuras, reto MCM y estadísticas.

   ESTRUCTURA (cada MÓDULO se puede mover después a su propio archivo .js;
   los módulos sin DOM —MathUtil, Content, Shape.layout/hit, Analytics— no
   dependen del navegador y se reutilizan en Capacitor / Tauri / PWA):

     Config      constantes, habilidades, niveles, tiempos y alertas
     MathUtil    mcd, mcm, primos, simplificar, mixtos  (base para v0.4+)
     Content     generador de preguntas, distractores y validación del modo clase
     Shape       figuras: geometría, dibujo en canvas, detección de toques
     Sound       efectos con Web Audio
     Store       almacenamiento: LocalStore (navegador), ApiStore (alumno: guarda en el
                 equipo y envía a la nube) y TeacherStore (docente: lee la nube)
     Cloud       Supabase por HTTP: acceso con código+lista+NIP, cola sin internet, docente
     Analytics   estadísticas por habilidad/figura/nivel y alertas tempranas
     UI          vistas: acceso, menú, juego, resumen, estadísticas, clase, docente
   ===================================================================== */

/* ============================ MODULE: Config ======================== */
const Config = {
  VERSION: '1.0.0',
  ROUND_SIZE: 8,
  TEACHER_PIN: '',            // solo modo local (sin nube): '' = sin PIN. Ejemplo: '2468'
  // ☁️ Nube (Supabase). La llave es PÚBLICA (anon/publishable); nunca pongas aquí la llave secret/service_role.
  // Si url queda vacía, FracLab funciona como antes: todo se guarda solo en el navegador.
  CLOUD: {url: 'https://ckrtyhwyfyisitlddyhj.supabase.co', key: 'sb_publishable_eWOQeERSDYW3Z_AIoxXiJQ_ZVBw0VQZ'},
  SKILLS: {
    identify:      {name: 'Identifica la fracción', icon: '🔍', active: true,  desc: 'Mira la figura y elige la fracción.'},
    color:         {name: 'Colorea la fracción',    icon: '🎨', active: true,  desc: 'Colorea las partes que indica el numerador.'},
    mcm:           {name: 'Mínimo común múltiplo', icon: '🧮', active: true, desc: 'Descubre el denominador común con la tabla de primos.'},
    line:          {name: 'Recta numérica',         icon: '📏', active: false, desc: 'Ubica fracciones en la recta.'},
    mixed:         {name: 'Fracciones con entero',  icon: '🧩', active: false, desc: 'Números mixtos e impropias.'},
    primes:        {name: 'Primos y factores',      icon: '🔢', active: false, desc: 'Números primos y descomposición.'},
    simplify:      {name: 'Simplifica',             icon: '✂️', active: true,  desc: 'Simplifica con números primos: simples y mixtas.'},
    addsub_like:   {name: 'Suma y resta (igual denominador)', icon: '➕', active: false, desc: 'Operaciones básicas.'},
    addsub_unlike: {name: 'Suma (distinto denominador)', icon: '🏁', active: true, desc: 'Simplifica, saca el mcm, usa la plantilla y suma.'}
  },
  SHAPES: {
    circle: {name: 'Círculo',            icon: '⚪'},
    square: {name: 'Cuadrado',           icon: '⬜'},
    rect:   {name: 'Rectángulo',         icon: '▭'},
    pastel: {name: 'Pastel',             icon: '🎂'},
    pizza:  {name: 'Pizza',              icon: '🍕'},
    choco:  {name: 'Barra de chocolate', icon: '🍫'}
  },
  // Figuras que aparecen al azar en cada nivel del juego
  LEVELS: {
    1: {name: 'Nivel 1', denoms: [2, 3, 4, 5, 6],               shapes: ['rect', 'circle'],                                      contiguous: true},
    2: {name: 'Nivel 2', denoms: [2, 3, 4, 5, 6, 7, 8],         shapes: ['rect', 'circle', 'square', 'choco'],                    contiguous: false},
    3: {name: 'Nivel 3', denoms: [3, 4, 5, 6, 7, 8, 9, 10, 12], shapes: ['rect', 'circle', 'square', 'choco', 'pizza', 'pastel'], contiguous: false}

/* ============================ MODULE: MathUtil ====================== */
const MathUtil = {
  gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; },
  lcm(a, b) { return (a === 0 || b === 0) ? 0 : Math.abs(a) / MathUtil.gcd(a, b) * Math.abs(b); },
  isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
    return true;
  },
  primeFactors(n) {
    const f = []; let m = n;
    for (let p = 2; p * p <= m; p++) while (m % p === 0) { f.push(p); m /= p; }
    if (m > 1) f.push(m);
    return f;
  },
  simplify(n, d) { const g = MathUtil.gcd(n, d) || 1; return {n: n / g, d: d / g}; },
  toMixed(n, d) { return {w: Math.floor(n / d), n: n % d, d}; },
  sameValue(a, b) { return a.n * b.d === b.n * a.d; },
  // ---- Mínimo común múltiplo por descomposición simultánea (el método del pizarrón) ----
  spf(n) { for (let p = 2; p * p <= n; p++) if (n % p === 0) return p; return n; },
  lcmAll(a) { return a.reduce((x, y) => MathUtil.lcm(x, y), 1); },
  // Un número que ya llegó a 1 termina ahí: en las filas siguientes su columna queda vacía (null)
  nextRow(row, p) { return row.map(x => (x === null || x === 1 ? null : (x % p === 0 ? x / p : x))); },
  rowDone(row) { return row.every(x => x === null || x === 1); },
  smallestDivisor(row) { const c = row.filter(x => x > 1).map(MathUtil.spf); return c.length ? Math.min.apply(null, c) : null; },
  // Simplificación por primos: divide arriba y abajo entre el primo más pequeño que divide a ambos, hasta que no haya ninguno
  simpSteps(n, d) {
    const chain = [{n, d, p: 0}], ps = []; let a = n, b = d;
    for (let g = MathUtil.gcd(a, b); g > 1; g = MathUtil.gcd(a, b)) {
      const p = MathUtil.spf(g); ps.push(p); chain[chain.length - 1].p = p; a /= p; b /= p; chain.push({n: a, d: b, p: 0});
    }
    return {chain, ps, res: {n: a, d: b}};
  },
  mcmTable(nums) {
    const rows = [nums.slice()], divs = []; let r = nums.slice();
    while (!MathUtil.rowDone(r)) { const p = MathUtil.smallestDivisor(r); divs.push(p); r = MathUtil.nextRow(r, p); rows.push(r); }
    return {rows, divs, mcm: divs.reduce((a, b) => a * b, 1)};
  }
};

/* ============================ MODULE: Content ======================= */
const rand = k => Math.floor(Math.random() * k);
const pick = arr => arr[rand(arr.length)];
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const Content = {
  make(skill, level, seen) {
    const L = Config.LEVELS[level];
    let q = null, tries = 0;
    do {
      const d = pick(L.denoms), n = 1 + rand(d - 1);
      q = {skill, level, n, d, shape: pick(L.shapes)};
    } while (seen && seen.has(q.n + '/' + q.d) && ++tries < 30);
    q.filled = Content.fillSet(q, L.contiguous);
    if (skill === 'identify') q.options = Content.options(q);
    return q;
  },
  // Elige figuras sin repetir la misma dos veces seguidas cuando hay opciones
  makeRound(skill, level, size) {
    const seen = new Set(), qs = [];
    for (let i = 0; i < size; i++) {
      let q, t = 0;
      do { q = Content.make(skill, level, seen); } while (qs.length && qs[qs.length - 1].shape === q.shape && ++t < 12);
      seen.add(q.n + '/' + q.d); qs.push(q);
    }
    return qs;
  },
  // ---- Reto MCM: colecciones de números cuyos factores primos son 2,3,5,7,11,13 ----
  smooth(n) { let m = n; Config.MCM.PRIMES.forEach(p => { while (m % p === 0) m /= p; }); return m === 1; },
  divisors(n) { const r = []; for (let i = 2; i < n; i++) if (n % i === 0) r.push(i); return r; },
  // Elige un mcm objetivo y k divisores suyos (sin repetir) cuyo mcm sea justo ese número
  makeMcm(level, seen, k) {
    const C = Config.MCM.LEVELS[level]; k = k || pick(C.ks);
    for (let t = 0; t < 900; t++) {
      const L = pick(C.lcms), ds = Content.divisors(L).filter(d => d >= C.min && d <= C.max);
      if (ds.length < k) continue;
      const nums = shuffle(ds).slice(0, k);
      if (MathUtil.lcmAll(nums) !== L) continue;
      const key = nums.slice().sort((x, y) => x - y).join(',');
      if (seen && seen.has(key)) continue;
      return {skill: 'mcm', level, nums, mcm: L, key};
    }
    const nums = {2: [4, 6], 3: [3, 4, 6], 4: [2, 3, 4, 6], 5: [2, 3, 4, 5, 6]}[k] || [4, 6];
    return {skill: 'mcm', level, nums, mcm: MathUtil.lcmAll(nums), key: nums.join(',')};
  },
  // Una ronda = 5 colecciones; en el nivel 2 se alternan colecciones de 3 y de 4 números
  makeMcmRound(level, size) {
    const seen = new Set(), qs = [], ks = Config.MCM.LEVELS[level].ks;
    for (let i = 0; i < size; i++) { const q = Content.makeMcm(level, seen, ks[i % ks.length]); seen.add(q.key); qs.push(q); }
    return qs;
  },
  // ---- Reto Simplifica ----
  makeSimp(level, seen, kind) {
    const L = Config.SIMP.LEVELS[level], r = (a, b) => a + rand(b - a + 1), g = MathUtil.gcd;
    for (let t = 0; t < 500; t++) {
      let w = 0, n, d;
      if (kind === 'simple' || kind === 'improper') {
        const b = r(L.bMin, L.bMax), a = kind === 'simple' ? r(1, b - 1) : r(b + 1, 2 * b + 3);
        if (g(a, b) !== 1) continue;
        const m = pick(L.mults); n = a * m; d = b * m; if (d > L.maxD) continue;
      } else if (kind === 'mixed') {
        const b = r(L.bMin, L.bMax), a = r(1, b - 1);
        if (g(a, b) !== 1) continue;
        const m = pick(L.mmults); n = a * m; d = b * m; w = r(1, L.maxW); if (d > L.mmaxD) continue;
      } else {
        d = r(L.irrMin, L.irrMax); n = r(1, d - 1); if (g(n, d) !== 1) continue;
        if (kind === 'mixedirred') w = r(1, L.maxW || 5);
      }
      const key = kind + ':' + w + ':' + n + '/' + d;
      if (seen && seen.has(key)) continue;
      return Content.finishSimp({skill: 'simplify', level, kind, w, n, d, key});
    }
    return Content.finishSimp({skill: 'simplify', level, kind, w: 0, n: 8, d: 12, key: 'fb' + rand(1e6)});
  },
  finishSimp(q) {
    const sol = MathUtil.simpSteps(q.w * q.d + q.n, q.d);
    q.N = q.w * q.d + q.n; q.res = sol.res; q.ps = sol.ps; return q;
  },
  makeSimpRound(level, size) {
    const seen = new Set(), qs = [], kinds = shuffle(Config.SIMP.LEVELS[level].kinds).slice(0, size);
    kinds.forEach(k => { const q = Content.makeSimp(level, seen, k); seen.add(q.key); qs.push(q); });
    return qs;
  },
  // ---- Reto Suma con distinto denominador ----
  solveAdd(fr) {
    const red = fr.map(f => MathUtil.simpSteps(f.w * f.d + f.n, f.d).res), dens = red.map(r => r.d), mcm = MathUtil.lcmAll(dens);
    const facs = dens.map(d => mcm / d), prods = red.map((r, i) => r.n * facs[i]), T = prods.reduce((a, b) => a + b, 0);
    return {red, dens, mcm, facs, prods, T, res: MathUtil.simpSteps(T, mcm).res};
  },
  makeAdd(level, seen) {
    const L = Config.ADD.LEVELS[level], g = MathUtil.gcd, r = (a, b) => a + rand(b - a + 1);
    for (let t = 0; t < 3000; t++) {
      const bs = []; for (let i = 0; i < L.k; i++) bs.push(r(2, L.bMax));
      if (new Set(bs).size !== L.k) continue;
      const lcm = MathUtil.lcmAll(bs); if (lcm > L.maxL) continue;
      if (lcm === Math.max.apply(null, bs) && Math.random() > 0.2) continue;   // casi siempre el mcm es distinto de todos los denominadores
      let kinds = bs.map(() => pick(L.kinds)); if (L.kinds.includes('mixed') && !kinds.includes('mixed')) kinds[rand(kinds.length)] = 'mixed';
      const fr = []; let bad = false;
      bs.forEach((b, i) => {
        const kind = kinds[i], a = kind === 'improper' ? r(b + 1, 2 * b + 2) : r(1, b - 1);
        if (g(a, b) !== 1) { bad = true; return; }
        const m = Math.random() < L.pRed ? pick([2, 3]) : 1, mm = b * m <= L.maxD ? m : 1;
        fr.push({w: kind === 'mixed' ? r(1, L.maxW) : 0, n: a * mm, d: b * mm});
      });
      if (bad) continue;
      const sol = Content.solveAdd(fr); if (sol.res.d === 1) continue;
      const key = fr.map(f => (f.w ? f.w + ' ' : '') + f.n + '/' + f.d).join(' + ');
      if (seen && seen.has(key)) continue;
      return {skill: 'addsub_unlike', level, fr, key, sol, mcm: sol.mcm};
    }
    const fr = [{w: 1, n: 1, d: 2}, {w: 2, n: 1, d: 4}], sol = Content.solveAdd(fr);
    return {skill: 'addsub_unlike', level, fr, key: '1 1/2 + 2 1/4', sol, mcm: sol.mcm};
  },
  makeAddRound(level, size) {
    const seen = new Set(), qs = [];
    for (let i = 0; i < size; i++) { const q = Content.makeAdd(level, seen); seen.add(q.key); qs.push(q); }
    return qs;
  },
  fillSet(q, contiguous) {
    const idx = [...Array(q.d).keys()];
    return new Set(contiguous ? idx.slice(0, q.n) : shuffle(idx).slice(0, q.n));
  },
  // 1 correcta + 3 distractores con valores distintos entre sí y distintos de la correcta
  options(q) {
    const right = {n: q.n, d: q.d, ok: true};
    const cands = [
      {n: q.d, d: q.n}, {n: q.n + 1, d: q.d}, {n: q.n - 1, d: q.d},
      {n: q.n, d: q.d + 1}, {n: q.n, d: q.d - 1}, {n: q.d - q.n, d: q.d}
    ].filter(c => c.n >= 1 && c.d >= 2 && c.n < c.d);
    const chosen = [right];
    for (const c of shuffle(cands)) {
      if (chosen.length === 4) break;
      if (chosen.every(o => !MathUtil.sameValue(o, c))) chosen.push({n: c.n, d: c.d, ok: false});
    }
    while (chosen.length < 4) { // relleno (con d = 2 hay pocos distractores naturales)
      const d = 2 + rand(Math.max(q.d, 6)), n = 1 + rand(d - 1), c = {n, d};
      if (chosen.every(o => !MathUtil.sameValue(o, c))) chosen.push({n, d, ok: false});
    }
    return shuffle(chosen);
  },
  classifyIdentify(q, o) {
    if (o.n === q.d && o.d === q.n) return 'swap';
    if (o.d === q.d && o.n === q.d - q.n) return 'complement';
    if ((o.d === q.d && Math.abs(o.n - q.n) === 1) || (o.n === q.n && Math.abs(o.d - q.d) === 1)) return 'off1';
    return 'other';
  },
  classifyColor(q, k) {
    if (k === q.d - q.n && k !== q.n) return 'complement';
    return k < q.n ? 'less' : 'more';
  },
  // ---- Modo clase: valida enteros / numerador / denominador según el tipo ----
  validateClass(c) {
    const K = Config.CLASS, d = c.d, n = c.n, w = c.tipo === 'mixta' ? c.w : 0;
    const bad = msg => ({ok: false, msg});
    if (![d, n, w].every(Number.isInteger)) return bad('Escribe números enteros en todos los campos.');
    if (d < 2 || d > K.maxDen) return bad('El denominador debe estar entre 2 y ' + K.maxDen + '.');
    if (c.tipo === 'propia' && !(n >= 1 && n < d)) return bad('En una fracción propia el numerador es mayor que 0 y menor que el denominador.');
    if (c.tipo === 'impropia' && n < d) return bad('En una fracción impropia el numerador es mayor o igual que el denominador.');
    if (c.tipo === 'mixta') {
      if (w < 1 || w > K.maxWhole) return bad('En una fracción mixta el entero va de 1 a ' + K.maxWhole + '.');
      if (!(n >= 1 && n < d)) return bad('En una fracción mixta la parte fraccionaria es propia (numerador menor que el denominador).');
    }
    const total = w * d + n, nf = Math.max(1, Math.ceil(total / d));
    if (nf > K.maxFigs) return bad('Se necesitarían ' + nf + ' figuras; el máximo es ' + K.maxFigs + '. Usa un numerador menor.');
    return {ok: true, w, n, d, total, nf};
  },
  randomClass(tipo) {
    const d = 2 + rand(11);
    if (tipo === 'propia') return {tipo, w: 0, n: 1 + rand(d - 1), d};
    if (tipo === 'mixta') return {tipo, w: 1 + rand(3), n: 1 + rand(d - 1), d};
    const maxN = Math.min(d * Config.CLASS.maxFigs, d * 3 + d - 1);
    return {tipo, w: 0, n: d + 1 + rand(maxN - d), d};
  }
};

/* ============================ MODULE: Roster ======================== */
const normGroup = g => String(g || '').trim().toUpperCase().replace(/\s+/g, '');
const Roster = {
  firstName(n) { return String(n || '').trim().split(/\s+/)[0] || ''; },
  /* Cada línea puede ser:  «Nombre»  (se numera en orden)  ·  «3 Nombre» · «3. Nombre» · «3, Nombre» · «3;Nombre» · «1F;3;Nombre»
     Devuelve {list: [{group, id, name}], errors: [texto]} */
  parse(text, group) {
    const list = [], errors = [], taken = {}, last = {};
    String(text || '').split(/\r?\n/).forEach((raw, ln) => {
      const line = raw.replace(/^\uFEFF/, '').trim().replace(/^["']+|["']+$/g, '').trim(); if (!line) return;
      if (/^(n[uú]mero|n[uú]m\.?|lista|no\.?|#)\s*[,;\t]\s*(nombre|alumno)/i.test(line)) return;   // encabezado de una tabla
      let g = group, id = null, name = line, m;
      if ((m = line.match(/^([^\s,;\t]*[A-Za-z][^\s,;\t]*)\s*[,;\t]\s*(\d{1,3})\s*[,;\t]\s*(.+)$/))) { g = m[1]; id = +m[2]; name = m[3]; }
      else if ((m = line.match(/^(\d{1,3})\s*(?:[.,;:)\t-]\s*|\s+)(.+)$/))) { id = +m[1]; name = m[2]; }
      name = name.replace(/^["'\s]+|["'\s]+$/g, '').replace(/\s+/g, ' ');
      g = normGroup(g);
      if (!g) return errors.push('Línea ' + (ln + 1) + ': falta el grupo.');
      if (!name) return errors.push('Línea ' + (ln + 1) + ': falta el nombre.');
      if (id == null) id = (last[g] || 0) + 1;
      if (id < 1 || id > 99) return errors.push('Línea ' + (ln + 1) + ': el número de lista debe ser de 1 a 99.');
      last[g] = id;
      const k = g + '-' + id;
      if (taken[k]) return errors.push('Línea ' + (ln + 1) + ': el número ' + id + ' de ' + g + ' está repetido.');
      taken[k] = 1; list.push({group: g, id, name});
    });
    return {list, errors};
  },
  toText(students) { return students.sort((a, b) => a.id - b.id).map(s => s.id + '. ' + (s.name || '')).join('\n'); }
};

/* ============================ MODULE: Shape ========================= */
const Shape = {
  ROUND: {circle: 1, pizza: 1, pastel: 1},
  THEMES: {
    circle: {on: '#2bb3a3', off: '#ffffff', line: '#1f2a44', lw: 3},
    square: {on: '#2bb3a3', off: '#ffffff', line: '#1f2a44', lw: 3},
    rect:   {on: '#2bb3a3', off: '#ffffff', line: '#1f2a44', lw: 3},
    pizza:  {on: '#f6b93b', off: '#f8e8c8', line: '#8a4b14', lw: 2.5},
    pastel: {on: '#f8a5c2', off: '#fff1b8', line: '#7b2d55', lw: 2.5},
    choco:  {on: '#6f3f22', off: '#ead7b7', line: '#3a2212', lw: 3}
  },
  CURSOR: '#f59e0b',
  gridDims(d) { let best = [1, d]; for (let r = 2; r * r <= d; r++) if (d % r === 0) best = [r, d / r]; return best; },
  aspect(kind, d) {
    if (kind === 'rect') return 2;
    if (kind === 'choco') { const [r, c] = Shape.gridDims(d); return (c * 1.0) / (r * 1.1); }
    return 1;
  },
  fit(aspect, box, pad) {
    const w = box.w - 2 * pad, h = box.h - 2 * pad;
    const W = (w / h > aspect) ? h * aspect : w, H = (w / h > aspect) ? h : w / aspect;
    return {x: box.x + (box.w - W) / 2, y: box.y + (box.h - H) / 2, w: W, h: H};
  },
  boxes(n, W, H) {
    const cols = n <= 3 ? n : Math.ceil(n / 2), rows = n <= 3 ? 1 : 2, bw = W / cols, bh = H / rows, out = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / cols), inRow = row < rows - 1 ? cols : n - cols * (rows - 1), col = i % cols;
      out.push({x: (W - inRow * bw) / 2 + col * bw, y: row * bh, w: bw, h: bh});
    }
    return out;
  },
  /* Devuelve {W,H,kind,d,nf,parts,figs,cols,rows}. parts[i], i = fig*d + k, en orden de coloreado. */
  layout(kind, d, nf, W, H) {
    nf = nf || 1; W = W || 640; H = H || 320;
    const parts = [], figs = [];
    let cols = d, rows = 1;
    Shape.boxes(nf, W, H).forEach((b, f) => {
      const R = Shape.fit(Shape.aspect(kind, d), b, Math.min(b.w, b.h) * 0.07);
      const fig = {x: R.x, y: R.y, w: R.w, h: R.h, cx: R.x + R.w / 2, cy: R.y + R.h / 2, r: Math.min(R.w, R.h) / 2};
      figs.push(fig);
      if (Shape.ROUND[kind]) {
        for (let k = 0; k < d; k++) {
          const a0 = -Math.PI / 2 + k * 2 * Math.PI / d;
          parts.push({t: 's', cx: fig.cx, cy: fig.cy, r: fig.r, a0, a1: a0 + 2 * Math.PI / d, k, d, fig: f});
        }
      } else if (kind === 'rect') {
        for (let k = 0; k < d; k++) parts.push({t: 'r', x: R.x + k * R.w / d, y: R.y, w: R.w / d, h: R.h, k, d, fig: f});
      } else { // square y choco: cuadrícula de partes iguales
        const [r, c] = Shape.gridDims(d);
        cols = c; rows = r;
        for (let k = 0; k < d; k++)
          parts.push({t: 'r', x: R.x + (k % c) * R.w / c, y: R.y + Math.floor(k / c) * R.h / r, w: R.w / c, h: R.h / r, k, d, fig: f});
      }
    });
    return {W, H, kind, d, nf, parts, figs, cols, rows};
  },
  hit(L, x, y) {
    for (let i = 0; i < L.parts.length; i++) {
      const p = L.parts[i];
      if (p.t === 'r') { if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) return i; }
      else {
        const dx = x - p.cx, dy = y - p.cy;
        if (dx * dx + dy * dy <= p.r * p.r) {
          const ang = (Math.atan2(dy, dx) + Math.PI / 2 + 2 * Math.PI) % (2 * Math.PI), s = 2 * Math.PI / p.d;
          if (ang >= p.k * s - 1e-9 && ang < (p.k + 1) * s) return i;
        }
      }
    }
    return -1;
  },
  draw(canvas, L, filled, o) {
    o = o || {};
    const ctx = canvas.getContext('2d'), sc = canvas.width / L.W, th = Shape.THEMES[L.kind];
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.clearRect(0, 0, L.W, L.H);
    const path = p => { ctx.beginPath(); if (p.t === 'r') ctx.rect(p.x, p.y, p.w, p.h); else { ctx.moveTo(p.cx, p.cy); ctx.arc(p.cx, p.cy, p.r, p.a0, p.a1); ctx.closePath(); } };
    const lwScale = Math.max(0.6, Math.min(1.4, L.figs[0].r / 140));
    ctx.lineJoin = 'round';
    L.parts.forEach((p, i) => {
      const on = filled.has(i);
      path(p); ctx.fillStyle = on ? th.on : th.off; ctx.fill();
      ctx.lineWidth = th.lw * lwScale; ctx.strokeStyle = th.line; ctx.stroke();
      if (L.kind === 'pizza' && on) {
        const m = (p.a0 + p.a1) / 2;
        [[0.62, 0.11], [0.32, 0.075]].forEach(([f, rr]) => { ctx.beginPath(); ctx.arc(p.cx + Math.cos(m) * p.r * f, p.cy + Math.sin(m) * p.r * f, p.r * rr * Math.min(1, 6 / p.d + 0.35), 0, 7); ctx.fillStyle = '#c0392b'; ctx.fill(); });
      }
      if (L.kind === 'pastel' && on) {
        const m = (p.a0 + p.a1) / 2;
        ctx.beginPath(); ctx.arc(p.cx + Math.cos(m) * p.r * 0.66, p.cy + Math.sin(m) * p.r * 0.66, p.r * 0.07, 0, 7); ctx.fillStyle = '#d63031'; ctx.fill();
        ctx.beginPath(); ctx.arc(p.cx + Math.cos(m) * p.r * 0.36, p.cy + Math.sin(m) * p.r * 0.36, p.r * 0.045, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();
      }
      if (L.kind === 'choco') {
        const ix = Math.min(p.w, p.h) * 0.16;
        ctx.fillStyle = on ? '#8a5230' : '#f3e4cb'; ctx.fillRect(p.x + ix, p.y + ix, p.w - 2 * ix, p.h - 2 * ix);
        ctx.lineWidth = 1.5 * lwScale; ctx.strokeStyle = on ? '#4d2a15' : '#cdb48c'; ctx.strokeRect(p.x + ix, p.y + ix, p.w - 2 * ix, p.h - 2 * ix);
      }
    });
    L.figs.forEach(f => { // contorno exterior de cada figura
      ctx.beginPath();
      if (Shape.ROUND[L.kind]) {
        if (L.kind === 'pizza') { ctx.arc(f.cx, f.cy, f.r - 5 * lwScale, 0, 7); ctx.lineWidth = 10 * lwScale; ctx.strokeStyle = '#c47f2c'; ctx.stroke(); ctx.beginPath(); }
        ctx.arc(f.cx, f.cy, f.r, 0, 7); ctx.lineWidth = (L.kind === 'pastel' ? 5 : th.lw + 1) * lwScale;
      } else { ctx.rect(f.x, f.y, f.w, f.h); ctx.lineWidth = (th.lw + 1.5) * lwScale; }
      ctx.strokeStyle = th.line; ctx.stroke();
    });
    if (o.numbers) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1f2a44';
      L.parts.forEach(p => {
        let x, y, s;
        if (p.t === 'r') { x = p.x + p.w / 2; y = p.y + p.h / 2; s = Math.min(p.w, p.h) * 0.42; }
        else { const m = (p.a0 + p.a1) / 2; x = p.cx + Math.cos(m) * p.r * 0.72; y = p.cy + Math.sin(m) * p.r * 0.72; s = Math.min(p.r * 0.22, p.r * 4 / p.d); }
        ctx.font = '700 ' + Math.max(9, s) + 'px "Segoe UI", Arial'; ctx.fillText(p.k + 1, x, y);
      });
    }
    if (o.cursor != null && o.cursor >= 0 && L.parts[o.cursor]) {
      path(L.parts[o.cursor]); ctx.setLineDash([8, 6]); ctx.lineWidth = 5 * lwScale; ctx.strokeStyle = Shape.CURSOR; ctx.stroke(); ctx.setLineDash([]);
    }
  }
};

/* ============================ MODULE: Sound ========================= */
const Sound = {
  ctx: null, on: true,
  beep(freq, dur, type, delay, vol) {
    if (!Sound.on) return;
    try {
      Sound.ctx = Sound.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = Sound.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (delay || 0);
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* sin audio */ }
  },
  ok() { Sound.beep(660, 0.12); Sound.beep(880, 0.18, 'sine', 0.12); },
  bad() { Sound.beep(180, 0.28, 'sawtooth', 0, 0.06); },
  tick() { Sound.beep(1000, 0.05, 'square', 0, 0.03); },
  siren() { for (let i = 0; i < 6; i++) Sound.beep(i % 2 ? 640 : 960, 0.16, 'square', i * 0.16, 0.05); },
  win() { [523, 659, 784, 1046].forEach((f, i) => Sound.beep(f, 0.18, 'triangle', i * 0.13)); }
};

/* ============================ MODULE: Music ========================= */
/* Chiptune original (canal de pulso + triángulo + ruido), sin archivos de audio.
   La tensión (0 → 1) sube el tempo y va sumando capas conforme se acaba el tiempo. */
const Music = {
  on: true, tension: 0, tmr: null, step: 0, nextT: 0, master: null, noiseBuf: null, notes: 0, bpm: 112,
  CH: [[45, 0], [41, 1], [43, 1], [40, 1]],            // raíz (MIDI) y si el acorde es mayor: La m · Fa · Sol · Mi
  LEAD: [69,0,72,0, 76,0,74,72, 69,0,72,0, 71,0,0,0,    // 4 compases de melodía (0 = silencio)
         65,0,69,0, 72,0,71,69, 65,0,69,0, 67,0,0,0,
         67,0,71,0, 74,0,72,71, 67,0,71,0, 69,0,0,0,
         68,0,71,0, 76,0,74,71, 68,0,71,0, 69,70,71,0],
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  bpmNow() { return 112 + 84 * Music.tension; },
  ctx() {
    try {
      Sound.ctx = Sound.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
      return Sound.ctx;
    } catch (e) { return null; }
  },
  tone(m, t, dur, type, vol) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(Music.hz(m), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + Math.max(0.008, dur * 0.55)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Music.master); o.start(t); o.stop(t + dur + 0.02); Music.notes++;
  },
  kick(t, vol) {
    const c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.09);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(Music.master); o.start(t); o.stop(t + 0.14); Music.notes++;
  },
  hat(t, vol) {
    const c = Sound.ctx;
    if (!Music.noiseBuf) { const b = c.createBuffer(1, Math.floor(c.sampleRate * 0.05), c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; Music.noiseBuf = b; }
    const n = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    n.buffer = Music.noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    n.connect(f); f.connect(g); g.connect(Music.master); n.start(t); n.stop(t + 0.05); Music.notes++;
  },
  playStep(s, t) {
    const T = Music.tension, i = s % 16, ch = Music.CH[Math.floor(s / 16) % 4], root = ch[0], sec = 60 / Music.bpmNow() / 4;
    // bajo (triángulo): corcheas al inicio; semicorcheas cuando el tiempo se agota
    if (T >= 0.55) Music.tone(root + (i % 2 ? 12 : 0), t, sec * 0.9, 'triangle', 0.1);
    else if (i % 2 === 0) Music.tone(root + (i % 4 === 2 ? 12 : 0), t, sec * 1.8, 'triangle', 0.1);
    // arpegio (pulso)
    if (T >= 0.25 && (T >= 0.5 || i % 2 === 0)) Music.tone(root + 24 + [0, ch[1] ? 4 : 3, 7, 12][(i >> (T >= 0.5 ? 0 : 1)) % 4], t, sec * 0.8, 'square', 0.026);
    // melodía
    const lv = Music.LEAD[s % 64];
    if (lv) { let n = 1; while (n < 4 && !Music.LEAD[(s + n) % 64] && n < 8) n++; Music.tone(lv + (T > 0.8 ? 12 : 0), t, sec * n * 0.92, 'square', 0.05); }
    // percusión
    if (T >= 0.2 && (i % 8 === 0 || (T >= 0.6 && i % 4 === 0))) Music.kick(t, 0.13);
    if (T >= 0.4 && (T >= 0.75 || i % 2 === 1)) Music.hat(t, 0.025 + 0.03 * T);
    // alarma en los últimos instantes
    if (T >= 0.88 && i % 4 === 0) Music.tone(i % 8 === 0 ? 96 : 93, t, sec * 1.4, 'square', 0.03);
  },
  sched() {
    const c = Sound.ctx; if (!c || !Music.tmr) return;
    if (Music.nextT < c.currentTime - 0.5) Music.nextT = c.currentTime + 0.05;
    while (Music.nextT < c.currentTime + 0.15) {
      Music.playStep(Music.step, Music.nextT);
      Music.nextT += 60 / Music.bpmNow() / 4; Music.step = (Music.step + 1) % 64;
    }
  },
  play() {
    if (!Music.on) return;
    if (Music.tmr) return;
    const c = Music.ctx(); if (!c) return;
    Music.master = c.createGain(); Music.master.gain.value = 0.6; Music.master.connect(c.destination);
    Music.step = 0; Music.nextT = c.currentTime + 0.05; Music.tension = 0;
    Music.tmr = setInterval(Music.sched, 25);
  },
  duck(on) { try { if (Music.master) Music.master.gain.setTargetAtTime(on ? 0.12 : 0.6, Sound.ctx.currentTime, 0.05); } catch (e) { /* sin audio */ } },
  setTension(f) { Music.tension = Math.max(0, Math.min(1, f)); },
  stop() {
    if (!Music.tmr) return;
    clearInterval(Music.tmr); Music.tmr = null;
    const m = Music.master, c = Sound.ctx; Music.master = null;
    try { m.gain.setTargetAtTime(0, c.currentTime, 0.04); setTimeout(() => { try { m.disconnect(); } catch (e) { /* ya cerrado */ } }, 400); } catch (e) { /* sin audio */ }
  }
};

/* ============================ MODULE: Store ========================= */
/* Interfaz que debe respetar cualquier almacenamiento (LocalStore hoy, ApiStore mañana):
   students() · student(key) · upsertStudent(s) · addRecord(r) · records(filter)
   exportAll() · importAll(obj) · clearAll() · persistent                           */
class LocalStore {
  constructor(ns) {
    this.ns = ns || 'fraclab.v1';   // mismo espacio que v0.1: conserva el progreso anterior
    this.mem = {};
    this.persistent = (() => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } })();
    this.data = this._read('data', {students: {}, records: []});
  }
  _read(k, def) {
    try { const raw = this.persistent ? localStorage.getItem(this.ns + '.' + k) : this.mem[k]; return raw ? JSON.parse(raw) : def; } catch (e) { return def; }
  }
  _save() {
    const raw = JSON.stringify(this.data);
    try { if (this.persistent) localStorage.setItem(this.ns + '.data', raw); else this.mem.data = raw; this.savedAt = Date.now(); } catch (e) { this.persistent = false; this.mem.data = raw; }
  }
  students() { return Object.values(this.data.students); }
  student(key) { return this.data.students[key] || null; }
  upsertStudent(s) { this.data.students[s.key] = Object.assign(this.data.students[s.key] || {}, s); this._save(); }
  upsertMany(arr) { arr.forEach(s => { this.data.students[s.key] = Object.assign(this.data.students[s.key] || {}, s); }); this._save(); }
  removeStudent(key) { delete this.data.students[key]; this.data.records = this.data.records.filter(r => r.sk !== key); this._save(); }
  roster(group) { return this.students().filter(s => s.group === group && s.name); }
  addRecord(r) {
    r.id = r.id || (r.sk + '|' + r.ts + '|' + Math.random().toString(36).slice(2, 7));
    this.data.records.push(r);
    if (this.data.records.length > 20000) this.data.records.splice(0, this.data.records.length - 20000);
    this._save();
  }
  records(filter) { return filter ? this.data.records.filter(filter) : this.data.records; }
  exportAll() { return {app: 'fraclab', version: Config.VERSION, exportedAt: new Date().toISOString(), students: this.students(), records: this.data.records}; }
  importAll(obj) {
    if (!obj || obj.app !== 'fraclab') throw new Error('Archivo no válido');
    const have = new Set(this.data.records.map(r => r.id));
    let added = 0;
    (obj.records || []).forEach(r => { if (r.id && !have.has(r.id)) { this.data.records.push(r); have.add(r.id); added++; } });
    (obj.students || []).forEach(s => {
      const cur = this.data.students[s.key];
      if (!cur) this.data.students[s.key] = s;
      else { if (!cur.name && s.name) cur.name = s.name; cur.points = Math.max(cur.points || 0, s.points || 0); cur.bestStreak = Math.max(cur.bestStreak || 0, s.bestStreak || 0); cur.lastSeen = Math.max(cur.lastSeen || 0, s.lastSeen || 0); }
    });
    this._save();
    return added;
  }
  clearAll() { this.data = {students: {}, records: []}; this._save(); }
}

/* ============================ MODULE: Cloud ========================= */
/* Conexión con Supabase por HTTP (sin librerías).
   · Alumnos (sin cuenta): solo llaman a las funciones student_login y submit_records.
   · Docente: inicio de sesión real (Supabase Auth); las tablas solo le responden a él (RLS).
   · Sin internet: los intentos se guardan en el equipo (cola) y se envían al volver la conexión. */
const Cloud = {
  T: null,            // sesión del docente {jwt, refresh, email}
  st: null,           // estado local: sesiones, cola de envío, códigos conocidos
  busy: false, timer: null,
  get on() { return !!(Config.CLOUD && Config.CLOUD.url && Config.CLOUD.key); },
  LS: 'fraclab.v1.cloud',
  init() {
    try { this.st = JSON.parse(localStorage.getItem(this.LS)) || {}; } catch (e) { this.st = {}; }
    ['sess', 'cred', 'chk', 'codes'].forEach(k => { this.st[k] = this.st[k] || {}; });
    ['outbox', 'rejected'].forEach(k => { this.st[k] = this.st[k] || []; });
    try { this.T = JSON.parse(sessionStorage.getItem('fraclab.t')) || null; } catch (e) { this.T = null; }
    if (!this.on || typeof window === 'undefined') return;
    window.addEventListener('online', () => { this.paint(); this.later(500); });
    window.addEventListener('offline', () => this.paint());
    setInterval(() => { if (this.st.outbox.length) this.sync(); }, 60000);
    this.later(1500);
  },
  save() { try { localStorage.setItem(this.LS, JSON.stringify(this.st)); } catch (e) { /* sin almacenamiento: queda en memoria */ } this.paint(); },
  // Huella local del NIP (solo para entrar sin internet en este equipo)
  hash(key, pin) {
    const s = 'fl|' + key + '|' + pin; let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0, c; i < s.length; i++) { c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  },
  async http(method, path, body, opt) {
    opt = opt || {};
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), opt.timeout || 12000);
    const h = {apikey: Config.CLOUD.key, 'Content-Type': 'application/json'};
    if (opt.jwt) h.Authorization = 'Bearer ' + opt.jwt;
    if (opt.prefer) h.Prefer = opt.prefer;
    let r;
    try {
      r = await fetch(Config.CLOUD.url.replace(/\/$/, '') + path, {method, headers: h, body: body == null ? undefined : JSON.stringify(body), signal: ctl.signal});
    } catch (e) { const er = new Error('offline'); er.offline = true; throw er; } finally { clearTimeout(tm); }
    const txt = await r.text(); let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
    return {ok: r.ok, status: r.status, data};
  },
  rpc(fn, args, opt) { return this.http('POST', '/rest/v1/rpc/' + fn, args, opt); },

  /* ---- Alumno ---- */
  async login(code, num, pin, create) {
    const r = await this.rpc('student_login', {p_code: code, p_num: num, p_pin: pin, p_create: !!create});
    if (!r.ok || !r.data) { const e = new Error('server'); e.http = r.status; throw e; }
    return r.data;
  },
  enqueue(r) {
    const o = this.st.outbox; o.push(Object.assign({}, r, {cid: String(r.id).slice(0, 40)}));
    if (o.length > 5000) o.splice(0, o.length - 5000);
    this.save(); this.later(1500);
  },
  later(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), ms); },
  reject(key) {
    const mine = this.st.outbox.filter(r => r.sk === key);
    this.st.rejected = this.st.rejected.concat(mine).slice(-500);
    this.st.outbox = this.st.outbox.filter(r => r.sk !== key);
    delete this.st.cred[key]; delete this.st.chk[key]; delete this.st.sess[key]; this.save();
  },
  async sync() {
    if (!this.on || this.busy || !this.st.outbox.length) { this.paint(); return; }
    this.busy = true; this.paint();
    try {
      const keys = [...new Set(this.st.outbox.map(r => r.sk))]; this.down = false;
      for (const key of keys) {
        let s = this.st.sess[key];
        if ((!s || !s.tok) && this.st.cred[key]) {      // alumno que entró sin internet: se confirma ahora
          const c = this.st.cred[key], r = await this.login(c.code, +key.split('-').pop(), c.pin, true);
          if (r.status === 'ok') { this.st.sess[key] = s = {tok: r.token, code: c.code}; delete this.st.cred[key]; this.save(); }
          else if (r.status === 'bad_pin' || r.status === 'locked' || r.status === 'bad_code' || r.status === 'bad_num') { this.reject(key); continue; }
          else continue;
        }
        if (!s || !s.tok) continue;                     // se reanuda cuando el alumno vuelva a entrar
        for (;;) {
          const batch = this.st.outbox.filter(r => r.sk === key).slice(0, 100);
          if (!batch.length) break;
          const u = (App.studentStore && App.studentStore.student(key)) || {};
          const r = await this.rpc('submit_records', {p_token: s.tok, p_points: u.points || 0, p_best: u.bestStreak || 0, p_records: batch});
          if (r.ok && r.data && r.data.status === 'ok') {
            const done = new Set(batch.map(x => x.cid));
            this.st.outbox = this.st.outbox.filter(x => !(x.sk === key && done.has(x.cid))); this.save();
          } else if (r.data && r.data.status === 'bad_token') { delete s.tok; this.save(); break; }
          else if (r.data && r.data.status === 'bad_batch') { this.reject(key); break; }
          else break;                                   // error del servidor: se reintenta luego
        }
      }
    } catch (e) { this.down = !!e.offline; }
    this.busy = false; this.paint();
  },
  paint() {
    if (!this.on || typeof document === 'undefined' || !this.st) return;
    let el = document.getElementById('cloudst');
    const n = this.st.outbox.length;
    if (!((App.user && !App.demo) || n)) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'cloudst'; document.body.appendChild(el); }
    const off = this.down || (typeof navigator !== 'undefined' && navigator.onLine === false);
    el.className = n ? 'warn' : '';
    el.textContent = this.busy ? '☁️ Enviando…' : n ? (off ? '📴 Sin internet · ' : '⏳ ') + n + ' pendiente' + (n > 1 ? 's' : '') + ' de enviar' : '☁️ Guardado en la nube';
  },

  /* ---- Docente ---- */
  setT(d, email) {
    this.T = {jwt: d.access_token, refresh: d.refresh_token, email: email || (d.user && d.user.email) || (this.T || {}).email || ''};
    try { sessionStorage.setItem('fraclab.t', JSON.stringify(this.T)); } catch (e) { /* ignorar */ }
  },
  tClear() { this.T = null; try { sessionStorage.removeItem('fraclab.t'); } catch (e) { /* ignorar */ } },
  async tLogin(email, pass) {
    const r = await this.http('POST', '/auth/v1/token?grant_type=password', {email, password: pass});
    if (!r.ok) return {ok: false, msg: r.status === 400 || r.status === 401 ? 'Correo o contraseña incorrectos.' : 'El servidor respondió con error (' + r.status + ').'};
    this.setT(r.data, email);
    const t = await this.tReq('POST', '/rest/v1/rpc/is_teacher', {});
    if (!t.ok || t.data !== true) { this.tClear(); return {ok: false, msg: 'Esta cuenta no está registrada como docente.'}; }
    return {ok: true};
  },
  async tRefresh() {
    if (!this.T || !this.T.refresh) return false;
    const r = await this.http('POST', '/auth/v1/token?grant_type=refresh_token', {refresh_token: this.T.refresh});
    if (!r.ok) { this.tClear(); return false; }
    this.setT(r.data); return true;
  },
  async tReq(method, path, body, prefer) {
    const authErr = () => Object.assign(new Error('auth'), {auth: true});
    if (!this.T) throw authErr();
    let r = await this.http(method, path, body, {jwt: this.T.jwt, prefer});
    if (r.status === 401) { if (await this.tRefresh()) r = await this.http(method, path, body, {jwt: this.T.jwt, prefer}); else throw authErr(); }
    return r;
  },
  async page(base) {
    let out = [], off = 0;
    for (;;) {
      const r = await this.tReq('GET', base + '&limit=1000&offset=' + off);
      if (!r.ok || !Array.isArray(r.data)) { const e = new Error('http'); e.http = r.status; throw e; }
      out = out.concat(r.data); if (r.data.length < 1000) break; off += 1000;
    }
    return out;
  },
  async loadTeacher() {
    const groups = await this.page('/rest/v1/groups?select=code,name,active,created_at&order=name');
    const students = await this.page('/rest/v1/students?select=id,group_name,num,has_pin,failed,locked_until,points,best_streak,created_at,last_seen&order=id');
    const records = await this.page('/rest/v1/records?select=id,student_id,client_id,ts,skill,lvl,ok,ms,err,data&order=id');
    return {groups, students, records};
  }
};

  constructor(d) {
    super('fraclab.v1');
    this.cloud = true; this.persistent = true; this.groups = d.groups;
    this.names = this._read('names', {});
    const st = {}, byId = {};
    d.students.forEach(s => {
      const key = s.group_name + '-' + s.num; byId[s.id] = key;
      st[key] = {key, group: s.group_name, id: s.num, dbId: s.id, hasPin: s.has_pin, lockedUntil: s.locked_until ? Date.parse(s.locked_until) : 0,
                 points: s.points, bestStreak: s.best_streak, created: Date.parse(s.created_at), lastSeen: s.last_seen ? Date.parse(s.last_seen) : 0};
    });
    Object.keys(this.names).forEach(k => {
      const m = /^(.+)-(\d+)$/.exec(k);
      if (!st[k] && m) st[k] = {key: k, group: m[1], id: +m[2], dbId: null, points: 0, bestStreak: 0, created: 0, lastSeen: 0};
      if (st[k]) st[k].name = this.names[k];

    d.records.forEach(r => {

      this.data.records.push(Object.assign({}, r.data, {id: r.client_id, sk: key, g: s.group, st: s.id, ts: Date.parse(r.ts), skill: r.skill, lvl: r.lvl, ok: r.ok, ms: r.ms}));
    });
  }
  _save() { try { localStorage.setItem(this.ns + '.names', JSON.stringify(this.names)); } catch (e) { /* sin almacenamiento */ } this.savedAt = Date.now(); }
  _merge(s) {
    if (s.name !== undefined) { if (s.name) this.names[s.key] = s.name; else delete this.names[s.key]; }
    this.data.students[s.key] = Object.assign(this.data.students[s.key] || {dbId: null, points: 0, bestStreak: 0, created: 0, lastSeen: 0}, s);
  }
  upsertStudent(s) { this._merge(s); this._save(); }
  upsertMany(arr) { arr.forEach(s => this._merge(s)); this._save(); }
  removeStudent(key) { delete this.names[key]; delete this.data.students[key]; this.data.records = this.data.records.filter(r => r.sk !== key); this._save(); }
  importAll() { throw new Error('No disponible con la nube'); }
  clearAll() { /* los datos de la nube no se borran desde aquí */ }
}

/* ============================ MODULE: Analytics ===================== */
const Analytics = {
  group(records, keyFn) {
    const out = {};
    records.forEach(r => {
      const k = keyFn(r), s = out[k] = out[k] || {a: 0, c: 0, ms: 0};
      s.a++; if (r.ok) s.c++; s.ms += r.ms || 0;
    });
    Object.values(out).forEach(s => { s.acc = s.a ? s.c / s.a : 0; s.avgMs = s.a ? s.ms / s.a : 0; });
    return out;
  },
  bySkill(records) { return Analytics.group(records, r => r.skill); },
  byDenominator(records) { return Analytics.group(records.filter(r => r.d != null), r => r.d); },
  byShape(records) { return Analytics.group(records.filter(r => r.shape), r => r.shape); },
  byLevel(records) { return Analytics.group(records, r => r.lvl || 1); },
  summary(records) {
    const a = records.length, c = records.filter(r => r.ok).length;
    return {a, c, acc: a ? c / a : 0, avgMs: a ? records.reduce((t, r) => t + (r.ms || 0), 0) / a : 0,
            timeouts: records.filter(r => r.to).length, rounds: new Set(records.filter(r => r.rd).map(r => r.rd)).size};
  },
  errorTypes(records) {
    const out = {};
    records.forEach(r => {
      if (r.errs) Object.keys(r.errs).forEach(k => { out[k] = (out[k] || 0) + r.errs[k]; });
      else if (!r.ok && r.err) out[r.err] = (out[r.err] || 0) + 1;
    });
    return out;
  },
  alerts(records, now) {
    const R = Config.ALERTS, al = [];
    now = now || Date.now();
    if (!records.length) return al;
    const sorted = records.slice().sort((a, b) => a.ts - b.ts);
    const sk = Analytics.bySkill(sorted);
    Object.keys(sk).forEach(k => {
      const s = sk[k];
      if (s.a >= R.minAttempts && s.acc < R.lowAcc)
        al.push({level: s.acc < R.critAcc ? 'high' : 'med', code: 'LOW_ACC',
                 text: 'Aciertos bajos en «' + Config.SKILLS[k].name + '» (' + Math.round(s.acc * 100) + '% en ' + s.a + ' intentos)'});
    });
    const recent = sorted.slice(-R.window);
    const errByD = {};
    recent.forEach(r => { if (!r.ok && !r.to && r.d != null) errByD[r.d] = (errByD[r.d] || 0) + 1; });
    Object.keys(errByD).forEach(d => {
      if (errByD[d] >= R.denomErrors) al.push({level: 'med', code: 'DENOM', text: 'Dificultad con denominador ' + d + ' (' + errByD[d] + ' errores recientes)'});
    });
    const fast = recent.filter(r => r.ms < R.fastMs);
    if (fast.length >= R.fastCount && fast.filter(r => r.ok).length / fast.length < R.fastAcc)
      al.push({level: 'med', code: 'FAST', text: 'Responde muy rápido y falla (posible adivinanza)'});
    const to = recent.filter(r => r.to).length;
    if (to >= R.timeouts) al.push({level: 'med', code: 'TIMEOUT', text: 'Se le acaba el tiempo con frecuencia (' + to + ' de las últimas ' + recent.length + ')'});
    const days = (now - sorted[sorted.length - 1].ts) / 86400000;
    if (days >= R.inactiveDays) al.push({level: 'med', code: 'INACTIVE', text: 'Sin actividad hace ' + Math.floor(days) + ' días'});
    return al;
  }
};

/* Pausa el reloj (y la medición de tiempo de respuesta) mientras una alerta grande está abierta */
function holdTimer(G) { if (G.holdAt) return; G.holdAt = performance.now(); if (App.tick) { clearInterval(App.tick); App.tick = null; G.held = true; } }
function resumeTimer(G) {
  if (!G.holdAt) return; const d = performance.now() - G.holdAt; G.holdAt = 0; G.t0 += d;
  if (G.held) { G.held = false; if (!G.locked) { G.deadline += d; tickLoop(G); } }
}

  (m.querySelector('#dlgin') || m.querySelector('#dlgyes')).focus();

    const code = ($('code').value || '').trim().toUpperCase(), num = parseInt($('num').value, 10), pin = $('pin').value.trim();
    if (code.length < 4) return err('Escribe el código de tu grupo.');
    if (!(num >= 1 && num <= 99)) return err('Escribe tu número de lista (1 a 99).');
    if (!/^\d{4}$/.test(pin)) return err('Tu NIP son 4 números.');
    if (phase === 'create' && $('pin2').value !== pin) return err('Los dos NIP no coinciden. Inténtalo de nuevo.');
    $('go').disabled = true; $('go').textContent = 'Entrando…';
    let r = null, down = false;
    try { r = await Cloud.login(code, num, pin, phase === 'create'); } catch (e) { if (e.offline) down = true; else r = {status: 'server', http: e.http}; }
    $('go').disabled = false; $('go').textContent = 'Entrar a jugar';
    if (down) return offline(code, num, pin);
    switch (r.status) {
      case 'ok': return enter(r, code, pin);
      case 'new': return askCreate('Es tu primera vez: crea tu NIP escribiéndolo otra vez abajo. Anótalo para no olvidarlo.');
      case 'bad_code': return err('Ese código de grupo no existe o está desactivado. Pídelo a tu maestro.');
      case 'bad_num': return err('Número de lista no válido.');
      case 'bad_pin_format': return err('Tu NIP son 4 números.');
      case 'bad_pin': return err('NIP incorrecto. Te quedan ' + r.left + ' intento' + (r.left === 1 ? '' : 's') + '.');
      case 'locked': return err('Demasiados intentos. Espera ' + Math.ceil(r.seconds / 60) + ' minuto(s) o pide a tu maestro que reinicie tu NIP.');
      default: return err('El servidor no respondió bien. Intenta de nuevo en un momento.');
    }
  };
  $('go').onclick = go;
  ['code', 'num', 'pin', 'pin2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  $('pin').addEventListener('input', () => { $('pin').value = $('pin').value.replace(/\D/g, ''); });
  $('pin2').addEventListener('input', () => { $('pin2').value = $('pin2').value.replace(/\D/g, ''); });
  $('teacher').onclick = () => Cloud.gate(enterTeacher);
  $('clase').onclick = () => Cloud.gate(viewDemo);
}

/* Resumen por grupo: promedio, temas donde más fallan, quién no ha practicado */
function groupSummary(sel) {
  const all = App.store.students(), recsAll = App.store.records(), by = {};
  recsAll.forEach(r => { (by[r.sk] = by[r.sk] || []).push(r); });
  const now = Date.now(), WEEK = 7 * 864e5;
  const groups = [...new Set(all.map(s => s.group))].sort().filter(g => !sel || g === sel);
  if (!groups.length) return '';
  return groups.map(g => {
    const sts = all.filter(s => s.group === g), recs = recsAll.filter(r => r.g === g), S = Analytics.summary(recs), sk = Analytics.bySkill(recs);
    const active = sts.filter(s => s.lastSeen && now - s.lastSeen < WEEK).length;
    const idle = sts.filter(s => !(by[s.key] || []).length || !s.lastSeen || now - s.lastSeen >= WEEK).sort((a, b) => a.id - b.id);
    const errs = Analytics.errorTypes(recs), eTop = Object.keys(errs).sort((a, b) => errs[b] - errs[a]).slice(0, 5);
    const den = Analytics.byDenominator(recs), dTop = Object.keys(den).filter(d => den[d].a >= 8).sort((a, b) => den[a].acc - den[b].acc).slice(0, 3);
    return '<div class="card"><h3>📊 Grupo ' + esc(g) + ' · ' + sts.length + ' alumno' + (sts.length === 1 ? '' : 's') + '</h3>' +
      '<p class="muted">Aciertos del grupo: <b>' + (S.a ? pct(S.acc) : '—') + '</b> · Intentos: ' + S.a + ' · Tiempo promedio: ' + (S.a ? secs(S.avgMs) : '—') + ' · Practicaron esta semana: <b>' + active + ' de ' + sts.length + '</b></p>' +
      '<div class="grid2"><div><b>Aciertos por reto</b>' + (Object.keys(sk).map(k => meter(Config.SKILLS[k] ? Config.SKILLS[k].icon + ' ' + Config.SKILLS[k].name : k, sk[k])).join('') || '<p class="muted small">Sin datos</p>') + '</div>' +
      '<div><b>Dónde más fallan</b><ul style="margin:6px 0">' + (eTop.map(k => '<li>' + esc(Config.ERR_LABELS[k] || k) + ' (' + errs[k] + ')</li>').join('') || '<li class="muted">Sin errores registrados</li>') + '</ul>' +
      (dTop.length ? '<p class="muted small">Denominadores más difíciles: ' + dTop.map(d => d + ' (' + pct(den[d].acc) + ')').join(' · ') + '</p>' : '') + '</div></div>' +
      '<div style="margin-top:10px"><b>Sin practicar esta semana (' + idle.length + ')</b><div>' +
      (idle.map(s => '<span class="badge med" title="' + (s.lastSeen ? 'Última vez: ' + fmtDate(s.lastSeen) : 'Nunca ha entrado') + '">' + esc(s.name || 'Lista ' + s.id) + (s.lastSeen ? '' : ' · nunca') + '</span>').join('') || '<span class="badge ok">Todos practicaron</span>') + '</div>' +
      '<p class="muted small">Para ver nombres en lugar de números, carga tu lista abajo (los nombres solo se guardan en este equipo).</p></div></div>';
  }).join('');
}

/* ---------- Juego ---------- */
function startRound(skill, level, custom) {
  const qs = custom ? custom : skill === 'mcm' ? Content.makeMcmRound(level, Config.MCM.ROUND)
           : skill === 'addsub_unlike' ? Content.makeAddRound(level, Config.ADD.ROUND)
           : skill === 'simplify' ? Content.makeSimpRound(level, Config.SIMP.ROUND)
           : Content.makeRound(skill, level, Config.ROUND_SIZE);
  Music.play(); App.inGame = true;
  App.game = {skill, level, qs, i: 0, correct: 0, points: 0, streak: 0, bestStreak: 0, rid: Date.now().toString(36), timer: App.timerOn, timeouts: 0, custom: !!custom};
  viewQuestion();
}

function viewQuestion() {
  const G = App.game, q = G.qs[G.i];
  if (q.skill === 'mcm') return viewMcm();
  if (q.skill === 'simplify') return viewSimp();
  if (q.skill === 'addsub_unlike') return viewAdd();
  G.locked = false; G.t0 = performance.now();
  G.layout = Shape.layout(q.shape, q.d, 1, 640, 320);
  G.filled = q.skill === 'identify' ? q.filled : new Set(); G.cursor = 0;
  G.limit = Config.TIME[q.skill][G.level]; Music.setTension(G.timer ? 0 : 0.25);
  const head = '<div class="topbar"><span class="pill">' + Config.SKILLS[q.skill].icon + ' ' + Config.LEVELS[G.level].name + ' · Pregunta ' + (G.i + 1) + ' de ' + G.qs.length + '</span>' +
    '<span><span class="pill" id="pts">⭐ ' + G.points + '</span> <span class="pill" id="stk">🔥 ' + G.streak + '</span> <button class="btn" id="quit">Salir</button></span></div>' +
    '<div class="bar"><i style="width:' + (G.i / G.qs.length * 100) + '%"></i></div>' +
    (G.timer ? '<div class="tbar"><i id="tb"></i><span id="tt"></span></div>' : '');
  let body;
  if (q.skill === 'identify') {
    body = '<div class="prompt">¿Qué fracción está coloreada?</div><div class="stage"><canvas id="cv" width="1280" height="640" aria-label="' + Config.SHAPES[q.shape].name + ' con partes coloreadas"></canvas></div>' +
      '<div class="opts">' + q.options.map((o, i) => '<button class="opt" data-i="' + i + '"><span class="k">' + (i + 1) + '</span>' + frac(o.n, o.d) + '</button>').join('') + '</div>';
  } else {
    body = '<div class="prompt">Colorea ' + frac(q.n, q.d, 'lg') + ' de ' + Config.SHAPES[q.shape].icon + ' la figura</div><div class="stage"><canvas id="cv" width="1280" height="640" tabindex="0" aria-label="Figura para colorear"></canvas></div>' +
      '<div class="row"><button class="btn" id="clr">Borrar</button><button class="btn primary" id="chk">Comprobar ✔</button></div>' +
      '<p class="muted small center" style="margin:8px auto;max-width:none">Toca las partes, o usa las flechas y la barra espaciadora. Enter = comprobar.</p>';
  }
  mount(head + '<div class="card">' + body + '<div class="fb hidden" id="fb"></div></div>', false, true);
  document.getElementById('quit').onclick = () => askConfirm('¿Salir de la ronda?', exitGame, 'Sí, salir');
  const cv = document.getElementById('cv'), L = G.layout;
  if (q.skill === 'identify') {
    Shape.draw(cv, L, q.filled);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => answerIdentify(+b.dataset.i));
    App.keys = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4 && !G.locked) answerIdentify(n - 1); };
  } else {
    const redraw = () => Shape.draw(cv, L, G.filled, {cursor: G.locked ? -1 : G.cursor});
    G.redraw = redraw; redraw();
    cv.onpointerdown = ev => {
      if (G.locked) return;
      const r = cv.getBoundingClientRect(), i = Shape.hit(L, (ev.clientX - r.left) * L.W / r.width, (ev.clientY - r.top) * L.H / r.height);
      if (i >= 0) { G.cursor = i; toggle(i); }
    };
    const toggle = i => { G.filled.has(i) ? G.filled.delete(i) : G.filled.add(i); redraw(); };
    document.getElementById('clr').onclick = () => { if (!G.locked) { G.filled.clear(); redraw(); } };
    document.getElementById('chk').onclick = () => { if (!G.locked) checkColor(); };
    App.keys = e => {
      if (G.locked) return;
      const n = L.parts.length, step = L.rows > 1 ? L.cols : 1;
      if (e.key === 'ArrowRight') G.cursor = (G.cursor + 1) % n;
      else if (e.key === 'ArrowLeft') G.cursor = (G.cursor - 1 + n) % n;
      else if (e.key === 'ArrowDown') G.cursor = Math.min(n - 1, G.cursor + step);
      else if (e.key === 'ArrowUp') G.cursor = Math.max(0, G.cursor - step);
      else if (e.key === ' ') { toggle(G.cursor); e.preventDefault(); return; }
      else if (e.key === 'Enter') { checkColor(); return; }
      else return;
      e.preventDefault(); redraw();
    };
  }
  if (G.timer) startTimer(G);
}

function startTimer(G) { G.deadline = performance.now() + G.limit * 1000; tickLoop(G); }
function tickLoop(G) {
  const tb = document.getElementById('tb'), tt = document.getElementById('tt'), total = G.limit * 1000; let lastSec = -1;
  App.tick = setInterval(() => {
    const left = Math.max(0, G.deadline - performance.now()), f = left / total;
    tb.style.width = (f * 100) + '%'; tb.className = f < 0.25 ? 'low' : ''; Music.setTension(1 - f);
    const s = Math.ceil(left / 1000); tt.textContent = s + ' s';
    if (s !== lastSec) { lastSec = s; if (s <= 3 && s > 0) Sound.tick(); }
    if (left <= 0) { stopTimer(); timeUp(); }
  }, 100);
}

function timeUp() {
  const G = App.game, q = G.qs[G.i]; if (G.locked) return;
  if (q.skill === 'mcm') return finalizeMcm(false, true);
  if (q.skill === 'simplify') return finalizeSimp(false, true);
  if (q.skill === 'addsub_unlike') return finalizeAdd(true);
  if (q.skill === 'identify') document.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (q.options[k].ok) b.classList.add('right'); });
  finalize(false, 'timeout', '—', true);
}

function answerIdentify(i) {
  const G = App.game, q = G.qs[G.i]; if (G.locked) return;
  const o = q.options[i];
  document.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (q.options[k].ok) b.classList.add('right'); });
  if (!o.ok) document.querySelectorAll('.opt')[i].classList.add('wrong');
  finalize(o.ok, o.ok ? null : Content.classifyIdentify(q, o), o.n + '/' + o.d);
}
function checkColor() {
  const G = App.game, q = G.qs[G.i]; if (G.locked) return;
  const k = G.filled.size, ok = k === q.n;
  finalize(ok, ok ? null : Content.classifyColor(q, k), String(k));
}

function finalize(ok, err, answer, timedOut) {
  const G = App.game, q = G.qs[G.i], ms = Math.round(performance.now() - G.t0);
  const leftFrac = G.timer ? Math.max(0, (G.deadline - performance.now()) / (G.limit * 1000)) : 0;
  stopTimer(); G.locked = true; Music.setTension(0);
  let pts = 0;
  if (ok) {
    G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const speed = G.timer ? Math.round(8 * leftFrac) : (ms < 6000 ? 5 : 0);
    pts = 10 + speed + (G.streak >= 5 ? 10 : G.streak >= 3 ? 5 : 0);
  } else G.streak = 0;
  if (timedOut) G.timeouts++;
  G.points += pts;
  const u = App.demo ? App.user : App.store.student(App.user.key);
  if (!App.demo) App.store.upsertStudent({key: u.key, points: (u.points || 0) + pts, bestStreak: Math.max(u.bestStreak || 0, G.bestStreak), lastSeen: Date.now()});
  if (!App.demo) App.store.addRecord({sk: u.key, g: u.group, st: u.id, ts: Date.now(), rd: G.rid, skill: q.skill, lvl: q.level, n: q.n, d: q.d, shape: q.shape,
                       ok, ms, err: err || '', ans: answer, to: !!timedOut, lim: G.timer ? G.limit : 0});
  ok ? Sound.ok() : Sound.bad();
  if (ok) popup('+' + pts);
  document.getElementById('pts').textContent = '⭐ ' + G.points;
  document.getElementById('stk').textContent = '🔥 ' + G.streak;
  if (G.redraw) G.redraw();
  let msg;
  if (timedOut) msg = '⏰ ¡Se acabó el tiempo! Eran ' + q.n + ' parte' + (q.n > 1 ? 's' : '') + ' de ' + q.d + ': ' + frac(q.n, q.d);
  else if (q.skill === 'identify') msg = (ok ? '¡Correcto! ' : 'Casi. ') + 'Hay ' + q.n + ' parte' + (q.n > 1 ? 's' : '') + ' coloreada' + (q.n > 1 ? 's' : '') + ' de ' + q.d + ' partes iguales: ' + frac(q.n, q.d);
  else msg = ok ? '¡Muy bien! Coloreaste ' + q.n + ' de ' + q.d + ' partes: ' + frac(q.n, q.d)
                : 'Debías colorear ' + q.n + ' de ' + q.d + ' partes (' + frac(q.n, q.d) + '). Coloreaste ' + answer + '.';
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok ? 'good' : 'bad');
  fb.innerHTML = msg + '<div class="row"><button class="btn primary" id="next">' + (G.i + 1 >= G.qs.length ? 'Ver resultado' : 'Siguiente') + ' ➜</button></div>';
  const chk = document.getElementById('chk'); if (chk) chk.disabled = true;
  const next = () => { G.i++; G.i >= G.qs.length ? viewSummary() : viewQuestion(); };
  document.getElementById('next').onclick = next;
  document.getElementById('next').focus();
  App.keys = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
}

/* ---------- Modo docente: juega como los alumnos ---------- */
// Ejercicios propios del docente: una línea por ejercicio
const Custom = {
  frac(t) {   // "2 4/8", "8/12" -> {w,n,d}
    const m = /^\s*(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)\s*$/.exec(t);
    if (!m) return null;
    const w = m[1] ? +m[1] : 0, n = +m[2], d = +m[3];
    return d >= 2 && d <= 999 && n >= 1 && n <= 9999 && w <= 99 ? {w, n, d} : null;
  },
  parse(skill, text, level) {
    const lines = text.split(/\n+/).map(x => x.trim()).filter(Boolean), qs = [], bad = [];
    lines.forEach((ln, i) => {
      const fail = () => bad.push('Línea ' + (i + 1) + ': "' + ln + '"');
      if (skill === 'mcm') {
        const nums = ln.split(/[\s,;y]+/).filter(Boolean).map(Number);
        if (nums.length < 2 || nums.length > 5 || nums.some(n => !(n >= 2 && n <= 60) || n % 1)) return fail();
        qs.push({skill: 'mcm', level, nums, mcm: MathUtil.lcmAll(nums), key: nums.join(',')});
      } else if (skill === 'simplify') {
        const f = Custom.frac(ln); if (!f) return fail();
        const kind = f.w ? 'mixed' : f.n >= f.d ? 'improper' : 'simple';
        qs.push(Content.finishSimp({skill: 'simplify', level, kind, w: f.w, n: f.n, d: f.d, key: ln}));
      } else if (skill === 'addsub_unlike') {
        const fr = ln.split('+').map(Custom.frac);
        if (fr.length < 2 || fr.length > 4 || fr.some(f => !f)) return fail();
        const sol = Content.solveAdd(fr);
        qs.push({skill: 'addsub_unlike', level, fr, key: ln, sol, mcm: sol.mcm});
      }
    });
    return {qs, bad};
  },
  EX: {mcm: '2 4 6\n3 5', simplify: '8/12\n2 4/8\n3 2/4', addsub_unlike: '1 1/2 + 2 1/4 + 1 1/6\n1/3 + 3/4'},
  HELP: {mcm: 'Una línea por ejercicio, números separados por espacio (2 a 5 números).', simplify: 'Una línea por fracción: 8/12 o mixta como 2 4/8.', addsub_unlike: 'Una línea por suma: 1 1/2 + 2 1/4 + 1 1/6 (2 a 4 fracciones).'}
};
