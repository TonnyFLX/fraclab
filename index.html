    if (i >= 0) { C.fill.has(i) ? C.fill.delete(i) : C.fill.add(i); paint(); }
  };
  $('fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) { /* no disponible */ } };
  $('back').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* ignorar */ } viewLogin(); };
  $('tabmcm').onclick = viewClassMcm; $('tabsimp').onclick = viewClassSimp; $('tabadd').onclick = viewClassAdd; $('tabdemo').onclick = viewDemo;
  sync(); update(true);
}

/* ---------- Reto MCM (descomposición simultánea) ---------- */
function mtableHTML(rows, divs, inputs, xl) {
  let h = '<div class="mtab' + (xl ? ' xl' : '') + '">';
  rows.forEach((r, i) => {
    h += '<div class="mrow' + (i === 0 ? ' first' : '') + '">' + r.map(x => '<span class="mc' + (i > 0 && x === 1 ? ' one' : '') + '">' + (x === null ? '' : i > 0 && x === 1 ? '<span>1</span>' : x) + '</span>').join('') +
         '<span class="mdiv">' + (divs[i] != null ? divs[i] : '') + '</span></div>';
  });
  if (inputs) {
    h += '<div class="mrow">';
    inputs.forEach((on, i) => { h += '<span class="mc">' + (on ? '<input type="number" inputmode="numeric" id="mi' + i + '" aria-label="Número ' + (i + 1) + ' de la nueva fila">' : '') + '</span>'; });
    h += '<span class="mdiv"></span></div>';
  }
  return h + '</div>';
}

function viewMcm() {
  const G = App.game, q = G.qs[G.i];
  G.locked = false; G.t0 = performance.now(); G.limit = Config.TIME.mcm[G.level] + 15 * (q.nums.length - 2); Music.setTension(G.timer ? 0 : 0.25);
  G.m = {rows: [q.nums.slice()], divs: [], phase: 'div', er: 0, hn: 0, errs: {}, rowErr: 0, hintP: null};
  const head = '<div class="topbar"><span class="pill">' + Config.SKILLS.mcm.icon + ' ' + Config.LEVELS[G.level].name + ' · Intento ' + (G.i + 1) + ' de ' + G.qs.length + ' · ' + q.nums.length + ' números</span>' +
    '<span><span class="pill" id="pts">⭐ ' + G.points + '</span> <span class="pill" id="stk">🔥 ' + G.streak + '</span> <button class="btn" id="quit">Salir</button></span></div>' +
    '<div class="bar"><i style="width:' + (G.i / G.qs.length * 100) + '%"></i></div>' +
    (G.timer ? '<div class="tbar"><i id="tb"></i><span id="tt"></span></div>' : '');
  mount(head + '<div class="card"><div class="prompt">Encuentra el mínimo común múltiplo de <b>' + q.nums.join(', ') + '</b></div>' +
    '<div class="mstage" id="mt"></div><div id="mpanel"></div><div class="mmsg" id="mmsg"></div><div class="fb hidden" id="fb"></div></div>', false, true);
  document.getElementById('quit').onclick = () => askConfirm('¿Salir de la ronda?', exitGame, 'Sí, salir');
  App.keys = e => { if (G.locked || G.m.phase !== 'div') return; const n = parseInt(e.key, 10); if ([2, 3, 5, 7].includes(n)) chooseP(n); };
  renderM();
  if (G.timer) startTimer(G);
}

function setM(msg, kind) { const el = document.getElementById('mmsg'); if (el) { el.textContent = msg || ''; el.className = 'mmsg ' + (kind || ''); } }

function renderM(msg, kind) {
  const G = App.game, M = G.m, last = M.rows[M.rows.length - 1], $ = id => document.getElementById(id);
  $('mt').innerHTML = mtableHTML(M.rows, M.divs, M.phase === 'fill' ? last.map(x => x > 1) : 0);
  let p = '';
  if (M.phase === 'div') {
    p = '<p class="muted center" style="margin:0 0 10px;max-width:none"><b>Paso ' + (M.divs.length + 1) + '.</b> Elige el número primo por el que vas a dividir: el más pequeño que divide al menos a uno de los números.</p>' +
        '<div class="pbtns">' + Config.MCM.PRIMES.map(x => '<button class="pbtn' + (M.hintP === x ? ' hint' : '') + '" data-p="' + x + '">' + x + '</button>').join('') + '</div>';
  } else if (M.phase === 'fill') {
    const pr = M.divs[M.divs.length - 1];
    p = '<p class="muted center" style="margin:0 0 10px;max-width:none">Dividiste entre <b>' + pr + '</b>. Escribe la nueva fila: divide los números que se pueden dividir y <b>baja</b> los demás.</p>' +
        '<div class="row"><button class="btn primary" id="mchk">Comprobar ✔</button></div>';
  } else if (M.phase === 'prod') {
    p = '<p class="muted center" style="margin:0 0 10px;max-width:none">¡Todos son 1! Multiplica los divisores de la derecha para descubrir el mcm.</p>' +
        '<div class="mformula">mcm = ' + M.divs.join(' × ') + ' = <input type="number" id="mprod" inputmode="numeric"></div><div class="row"><button class="btn primary" id="mchk2">Comprobar ✔</button></div>';
  }
  if (M.phase !== 'done') p += '<div class="row"><button class="btn sm" id="mhint">💡 Pista (-3 pts)</button></div>';
  $('mpanel').innerHTML = p; setM(msg, kind);
  document.querySelectorAll('.pbtn').forEach(b => b.onclick = () => chooseP(+b.dataset.p));
  if ($('mchk')) $('mchk').onclick = checkRow;
  if ($('mchk2')) $('mchk2').onclick = checkProd;
  if ($('mhint')) $('mhint').onclick = hintM;
  document.querySelectorAll('#mt input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkRow(); } }));
  if ($('mprod')) { $('mprod').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkProd(); } }); $('mprod').focus(); }
  const f0 = document.querySelector('#mt input'); if (f0) f0.focus();
}

function chooseP(p) {
  const G = App.game, M = G.m; if (G.locked || M.phase !== 'div') return;
  const last = M.rows[M.rows.length - 1];
  if (!last.some(x => x > 1 && x % p === 0)) {
    M.er++; M.errs.prime = (M.errs.prime || 0) + 1; Sound.bad();
    return setM('❌ ' + p + ' no divide a ninguno de los números de la fila. Prueba con otro primo.', 'bad');
  }
  const small = MathUtil.smallestDivisor(last);
  M.divs.push(p); M.phase = 'fill'; M.hintP = null; M.rowErr = 0;
  renderM(p !== small ? 'Funciona, pero normalmente empezamos con el primo más pequeño (' + small + ').' : '', 'tip');
}

function checkRow() {
  const G = App.game, M = G.m; if (G.locked || M.phase !== 'fill') return;
  const last = M.rows[M.rows.length - 1], p = M.divs[M.divs.length - 1], exp = MathUtil.nextRow(last, p);
  const wrong = [];
  exp.forEach((v, i) => {
    if (v === null) return;
    const el = document.getElementById('mi' + i), s = el.value.trim(), ok = s !== '' && parseInt(s, 10) === v;
    el.classList.toggle('bad', !ok); el.classList.toggle('good', ok);
    if (!ok) wrong.push(i);
  });
  if (!wrong.length) { M.rows.push(exp); M.phase = MathUtil.rowDone(exp) ? 'prod' : 'div'; M.rowErr = 0; Sound.ok(); return renderM('✔ ¡Bien!', 'good'); }
  M.er++; M.rowErr++; Sound.bad();
  const types = new Set(wrong.map(i => (last[i] % p === 0 ? 'div' : 'down')));
  types.forEach(t => { M.errs[t] = (M.errs[t] || 0) + 1; });
  let msg = types.has('down') ? '❌ Si un número no se puede dividir entre ' + p + ', se baja igual.' : '❌ Revisa la división en las casillas rojas.';
  if (M.rowErr >= 2) msg += ' Ayuda: ' + last.filter(x => x > 1).map(x => (x % p === 0 ? x + ' ÷ ' + p + ' = ' + (x / p) : x + ' se baja')).join(' · ');
  setM(msg, 'bad');
}

function checkProd() {
  const G = App.game, M = G.m; if (G.locked || M.phase !== 'prod') return;
  const prod = M.divs.reduce((a, b) => a * b, 1), v = parseInt(document.getElementById('mprod').value, 10);
  if (v === prod) { M.phase = 'done'; return finalizeMcm(true, false); }
  M.er++; M.errs.mult = (M.errs.mult || 0) + 1; Sound.bad();
  setM('❌ Multiplica solo los divisores de la derecha: ' + M.divs.join(' × ') + '. Hazlo de dos en dos.', 'bad');
}

function hintM() {
  const G = App.game, M = G.m; if (G.locked) return;
  const last = M.rows[M.rows.length - 1]; M.hn++;
  if (M.phase === 'div') { M.hintP = MathUtil.smallestDivisor(last); return renderM('💡 Prueba con el ' + M.hintP + ': divide al menos a uno de los números.', 'tip'); }
  if (M.phase === 'fill') { const p = M.divs[M.divs.length - 1]; return setM('💡 ' + last.filter(x => x > 1).map(x => (x % p === 0 ? x + ' ÷ ' + p + ' = ' + (x / p) : x + ' no se divide: se baja')).join(' · '), 'tip'); }
  const d = M.divs; setM('💡 Multiplica de dos en dos: ' + d[0] + ' × ' + d[1] + ' = ' + (d[0] * d[1]) + (d.length > 2 ? ', y ese resultado × ' + d[2] + '…' : ''), 'tip');
}

function finalizeMcm(_ok, timedOut) {
  const G = App.game, q = G.qs[G.i], M = G.m; if (G.locked) return;
  const ms = Math.round(performance.now() - G.t0);
  const leftFrac = G.timer ? Math.max(0, (G.deadline - performance.now()) / (G.limit * 1000)) : 0;
  stopTimer(); G.locked = true; Music.setTension(0);
  const ok = !timedOut && M.er <= 1 && M.hn <= 1;
  let pts = 0;
  if (ok) {
    G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const speed = G.timer ? Math.round(8 * leftFrac) : 0;
    pts = Math.max(4, 10 + speed - 3 * M.hn - 2 * M.er) + (G.streak >= 5 ? 10 : G.streak >= 3 ? 5 : 0);
  } else { G.streak = 0; pts = timedOut ? 0 : 2; }
  if (timedOut) G.timeouts++;
  G.points += pts;
  const mainErr = timedOut ? 'timeout' : Object.keys(M.errs).sort((a, b) => M.errs[b] - M.errs[a])[0] || '';
  const u = App.demo ? App.user : App.store.student(App.user.key);
  if (!App.demo) App.store.upsertStudent({key: u.key, points: (u.points || 0) + pts, bestStreak: Math.max(u.bestStreak || 0, G.bestStreak), lastSeen: Date.now()});
  if (!App.demo) App.store.addRecord({sk: u.key, g: u.group, st: u.id, ts: Date.now(), rd: G.rid, skill: 'mcm', lvl: q.level, nums: q.nums, mcm: q.mcm, n: null, d: null, shape: '',
                       ok, ms, err: mainErr, errs: M.errs, er: M.er, hn: M.hn, to: !!timedOut, lim: G.timer ? G.limit : 0});
  ok ? Sound.ok() : Sound.bad();
  if (ok) popup('+' + pts);
  const T = MathUtil.mcmTable(q.nums), $ = id => document.getElementById(id);
  if (timedOut) $('mt').innerHTML = mtableHTML(T.rows, T.divs, 0);
  $('mpanel').innerHTML = ''; setM('');
  $('pts').textContent = '⭐ ' + G.points; $('stk').textContent = '🔥 ' + G.streak;
  const msg = (ok ? '¡Muy bien! ' : timedOut ? '⏰ ¡Se acabó el tiempo! ' : 'Terminaste, pero con varios errores. ') +
    'mcm → ' + T.divs.join(' × ') + ' = <b>' + q.mcm + '</b>' +
    (q.nums.length === 2 ? '<div class="small" style="margin-top:8px">Por eso ' + frac(1, q.nums[0]) + ' + ' + frac(1, q.nums[1]) + ' se pueden sumar con denominador común <b>' + q.mcm + '</b>.</div>' : '');
  const fb = $('fb'); fb.className = 'fb ' + (ok ? 'good' : 'bad');
  fb.innerHTML = msg + '<div class="row"><button class="btn primary" id="next">' + (G.i + 1 >= G.qs.length ? 'Ver resultado' : 'Siguiente') + ' ➜</button></div>';
  const next = () => { G.i++; G.i >= G.qs.length ? viewSummary() : viewQuestion(); };
  $('next').onclick = next; $('next').focus();
  App.keys = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
}

/* ---------- Reto Simplifica (números primos) ---------- */
const simpPre = (q, cls, eq) => q.w > 0 ? fracMixed(q.w, q.n, q.d, cls || 'lg') + (eq === false ? '' : '<span class="eq">=</span>') : '';
// cadena de fracciones como en el pizarrón: 8/12 ÷2 = 4/6 ÷2 = [2/3]
function chainHTML(chain, boxLast, cls) {
  return chain.map((c, i) => {
    const last = i === chain.length - 1, whole = boxLast && last && c.d === 1;
    const f = frac(c.n, c.d, cls || 'lg'), dv = c.p ? '<span class="dv"><b>÷' + c.p + '</b><b>÷' + c.p + '</b></span>' : '';
    return '<span class="sf' + (boxLast && last && !whole ? ' fbox' : '') + '">' + f + dv + '</span>' +
      (whole ? '<span class="eq">=</span><span class="fbox num">' + c.n + '</span>' : '') + (last ? '' : '<span class="eq">=</span>');
  }).join('');
}

function viewSimp() {
  const G = App.game, q = G.qs[G.i];
  G.locked = false; G.t0 = performance.now(); G.limit = Config.TIME.simplify[G.level]; Music.setTension(G.timer ? 0 : 0.25);
  G.s = {phase: q.w > 0 ? 'conv' : 'simp', chain: q.w > 0 ? [] : [{n: q.n, d: q.d, p: 0}], er: 0, hn: 0, errs: {}, hintP: null};
  const head = '<div class="topbar"><span class="pill">' + Config.SKILLS.simplify.icon + ' ' + Config.LEVELS[G.level].name + ' · Intento ' + (G.i + 1) + ' de ' + G.qs.length + '</span>' +
    '<span><span class="pill" id="pts">⭐ ' + G.points + '</span> <span class="pill" id="stk">🔥 ' + G.streak + '</span> <button class="btn" id="quit">Salir</button></span></div>' +
    '<div class="bar"><i style="width:' + (G.i / G.qs.length * 100) + '%"></i></div>' +
    (G.timer ? '<div class="tbar"><i id="tb"></i><span id="tt"></span></div>' : '');
  mount(head + '<div class="card"><div class="prompt">' + (q.w > 0 ? 'Simplifica la fracción mixta' : 'Simplifica la fracción') + '</div>' +
    '<div class="chain" id="sch"></div><div id="spanel"></div><div class="mmsg" id="mmsg"></div><div class="fb hidden" id="fb"></div></div>', false, true);
  document.getElementById('quit').onclick = () => askConfirm('¿Salir de la ronda?', exitGame, 'Sí, salir');
  App.keys = e => { const S = G.s; if (G.locked || S.phase !== 'simp') return; const n = parseInt(e.key, 10); if ([2, 3, 5, 7].includes(n)) chooseS(n); else if (e.key === '0') stopS(); };
  renderS();
  if (G.timer) startTimer(G);
}

function renderS(msg, kind) {
  const G = App.game, q = G.qs[G.i], S = G.s, $ = id => document.getElementById(id);
  let ch = simpPre(q), p = '';
  if (S.phase === 'conv') {
    ch += '<span class="frac lg"><span class="n"><input type="number" id="cin" inputmode="numeric" aria-label="Nuevo numerador"></span><span class="d">' + q.d + '</span></span>';
    p = '<p class="muted center" style="margin:0 0 10px;max-width:none"><b>Paso 1.</b> Multiplica el entero por el denominador y suma el numerador. El resultado es el nuevo numerador; el denominador se queda igual.</p>' +
        '<div class="row"><button class="btn primary" id="schk">Comprobar ✔</button></div>';
  } else {
    ch += chainHTML(S.chain, S.phase === 'done');
    if (S.phase === 'simp') {
      p = '<p class="muted center" style="margin:0 0 10px;max-width:none">Elige un número primo que divida <b>igual</b> al numerador y al denominador. Cuando ya ninguno sirva, detecta que ya no se puede simplificar.</p>' +
          '<div class="pbtns">' + Config.SIMP.PRIMES.map(x => '<button class="pbtn' + (S.hintP === x ? ' hint' : '') + '" data-p="' + x + '">' + x + '</button>').join('') + '</div>' +
          '<div class="row"><button class="btn ok sstop" id="sstop">✋ Ya no se puede simplificar</button></div>';
    }
  }
  if (S.phase !== 'done') p += '<div class="row"><button class="btn sm" id="shint">💡 Pista (-3 pts)</button></div>';
  $('sch').innerHTML = ch; $('spanel').innerHTML = p; setM(msg, kind);
  document.querySelectorAll('#spanel .pbtn').forEach(b => b.onclick = () => chooseS(+b.dataset.p));
  if ($('schk')) $('schk').onclick = checkConv;
  if ($('sstop')) $('sstop').onclick = stopS;
  if ($('shint')) $('shint').onclick = hintS;
  if ($('cin')) { $('cin').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkConv(); } }); $('cin').focus(); }
}

function checkConv() {
  const G = App.game, q = G.qs[G.i], S = G.s; if (G.locked || S.phase !== 'conv') return;
  const v = parseInt(document.getElementById('cin').value, 10);
  if (v === q.N) { S.phase = 'simp'; S.chain = [{n: q.N, d: q.d, p: 0}]; Sound.ok(); return renderS('✔ ' + q.w + ' × ' + q.d + ' + ' + q.n + ' = ' + q.N + '. Ahora simplifica por primos.', 'good'); }
  S.er++; Sound.bad();
  const t = v === q.w * q.d ? 'noadd' : 'conv'; S.errs[t] = (S.errs[t] || 0) + 1;
  setM(t === 'noadd' ? '❌ Ya multiplicaste ' + q.w + ' × ' + q.d + ' = ' + (q.w * q.d) + '. Falta sumar el numerador.' : '❌ Revisa: primero multiplica ' + q.w + ' × ' + q.d + ' y después suma ' + q.n + '.', 'bad');
}

function divLine(label, x, p) {
  const q = Math.floor(x / p), r = x % p;
  if (r === 0) return label + ': <b>' + x + '</b> ÷ ' + p + ' = ' + q + ' <span class="okc">✔ exacta</span>';
  if (x < p) return label + ': <b>' + x + '</b> ÷ ' + p + ' → ' + x + ' es menor que ' + p + ', no alcanza <span class="badc">✖ no es exacta</span>';
  return label + ': <b>' + x + '</b> ÷ ' + p + ' = ' + q + ' y sobran ' + r + ' <span class="badc">✖ no es exacta</span>';
}
// El primo elegido no divide a los dos números: alerta grande con sirena y la razón
function alertBadPrime(p, n, d) {
  const a = n % p === 0, b = d % p === 0;
  const why = !a && !b ? 'El ' + p + ' no divide exacto ni al numerador ni al denominador.'
                       : 'El ' + p + ' sí divide exacto a ' + (a ? n : d) + ', pero no a ' + (a ? d : n) + '.';
  const tip = a || b ? 'Si dividiéramos solo uno de los dos números, la fracción cambiaría de valor. Por eso el primo tiene que dividir <b>a los dos</b>.'
                     : 'Para simplificar, el primo tiene que dividir <b>exacto</b> (sin que sobre nada) al numerador y al denominador.';
  Sound.siren();
  bigAlert({kind: 'bad', icon: '🚨', title: '¡El ' + p + ' no sirve!', lock: 900, btn: 'Entendido, intentar de nuevo',
            html: '<p class="aline">' + divLine('Numerador', n, p) + '</p><p class="aline">' + divLine('Denominador', d, p) + '</p><p>' + why + '</p><p class="atip">' + tip + '</p>'});
}
// Dijo «ya no se puede» pero todavía se puede
function alertEarly(n, d, hintP) {
  Sound.siren();
  bigAlert({kind: 'bad', icon: '🚨', title: '¡Todavía se puede simplificar!', lock: 900, btn: 'Entendido, seguir simplificando',
            html: '<p>Mira: <b>' + n + '</b> y <b>' + d + '</b> todavía se pueden dividir entre el mismo número primo.</p>' +
                  '<p class="atip">Antes de parar, prueba con 2, 3, 5, 7… hasta estar seguro de que ninguno divide a los dos.' + (hintP ? ' <br>Pista: prueba con el <b>' + hintP + '</b>.' : '') + '</p>'});
}
// Detectó bien que ya no se puede simplificar: alerta de victoria con la explicación
function alertWin(cur) {
  const f = x => x < 2 ? x + ' no tiene factores primos' : MathUtil.isPrime(x) ? x + ' es primo' : x + ' = ' + MathUtil.primeFactors(x).join(' × ');
  const html = cur.d === 1
    ? '<p class="aline">' + cur.n + ' ÷ 1 = <b>' + cur.n + '</b></p><p>El denominador llegó a <b>1</b>, así que el resultado es un número entero.</p><p class="atip">Un número entero ya no se puede simplificar.</p>'
    : '<p class="aline">' + f(cur.n) + '</p><p class="aline">' + f(cur.d) + '</p>' +
      '<p>' + (cur.n === 1 ? 'El numerador es 1 y ningún primo divide a 1.' : 'No tienen ningún número primo en común.') + '</p>' +
      '<p class="atip">Como ningún primo divide a la vez al numerador y al denominador, <b>' + cur.n + '/' + cur.d + ' ya no se puede simplificar más</b>. A una fracción así se le llama <b>irreducible</b>.</p>';
  Sound.win();
  bigAlert({kind: 'win', icon: '🎉', title: '¡Muy bien, lo detectaste!', lock: 500, btn: 'Continuar ➜', html,
            onClose: () => { const nx = document.getElementById('next'); if (nx) nx.focus(); }});
}

function chooseS(p) {
  const G = App.game, S = G.s; if (G.locked || S.phase !== 'simp') return;
  const cur = S.chain[S.chain.length - 1], a = cur.n % p === 0, b = cur.d % p === 0;
  if (!(a && b)) {
    S.er++; S.errs.sprime = (S.errs.sprime || 0) + 1; setM('');
    return alertBadPrime(p, cur.n, cur.d);
  }
  cur.p = p; S.chain.push({n: cur.n / p, d: cur.d / p, p: 0}); S.hintP = null; Sound.beep(700, 0.08);
  if (cur.d / p === 1) { S.phase = 'done'; renderS(); finalizeSimp(true, false); return alertWin(S.chain[S.chain.length - 1]); }
  renderS('✔ ' + cur.n + ' ÷ ' + p + ' = ' + (cur.n / p) + ' y ' + cur.d + ' ÷ ' + p + ' = ' + (cur.d / p) + '. ¿Se puede seguir?', 'good');
}

function stopS() {
  const G = App.game, S = G.s; if (G.locked || S.phase !== 'simp') return;
  const cur = S.chain[S.chain.length - 1], g = MathUtil.gcd(cur.n, cur.d);
  if (g > 1) {
    S.er++; S.errs.early = (S.errs.early || 0) + 1; setM('');
    return alertEarly(cur.n, cur.d, S.errs.early >= 2 ? MathUtil.spf(g) : 0);
  }
  S.phase = 'done'; renderS(); finalizeSimp(true, false); alertWin(cur);
}

function hintS() {
  const G = App.game, q = G.qs[G.i], S = G.s; if (G.locked) return;
  S.hn++;
  if (S.phase === 'conv') return setM('💡 ' + q.w + ' × ' + q.d + ' = ' + (q.w * q.d) + '. Ahora suma el numerador ' + q.n + '.', 'tip');
  const cur = S.chain[S.chain.length - 1], g = MathUtil.gcd(cur.n, cur.d);
  if (g > 1) { S.hintP = MathUtil.spf(g); return renderS('💡 Prueba con el ' + S.hintP + ': divide a ' + cur.n + ' y a ' + cur.d + '.', 'tip'); }
  setM('💡 Ningún número primo divide a la vez a ' + cur.n + ' y a ' + cur.d + ': ya no se puede simplificar.', 'tip');
}

function finalizeSimp(_ok, timedOut) {
  const G = App.game, q = G.qs[G.i], S = G.s, $ = id => document.getElementById(id); if (G.locked) return;
  const ms = Math.round(performance.now() - G.t0);
  const leftFrac = G.timer ? Math.max(0, (G.deadline - performance.now()) / (G.limit * 1000)) : 0;
  stopTimer(); G.locked = true; Music.setTension(0);
  const ok = !timedOut && S.er <= 1 && S.hn <= 1;
  let pts = 0;
  if (ok) {
    G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const speed = G.timer ? Math.round(8 * leftFrac) : 0;
    pts = Math.max(4, 10 + speed - 3 * S.hn - 2 * S.er) + (G.streak >= 5 ? 10 : G.streak >= 3 ? 5 : 0);
  } else { G.streak = 0; pts = timedOut ? 0 : 2; }
  if (timedOut) G.timeouts++;
  G.points += pts;
  const mainErr = timedOut ? 'timeout' : Object.keys(S.errs).sort((a, b) => S.errs[b] - S.errs[a])[0] || '';
  const u = App.demo ? App.user : App.store.student(App.user.key);
  if (!App.demo) App.store.upsertStudent({key: u.key, points: (u.points || 0) + pts, bestStreak: Math.max(u.bestStreak || 0, G.bestStreak), lastSeen: Date.now()});
  if (!App.demo) App.store.addRecord({sk: u.key, g: u.group, st: u.id, ts: Date.now(), rd: G.rid, skill: 'simplify', lvl: q.level, kind: q.kind, w: q.w, n: q.n, d: q.d, shape: '',
                       res: q.res.n + '/' + q.res.d, ok, ms, err: mainErr, errs: S.errs, er: S.er, hn: S.hn, to: !!timedOut, lim: G.timer ? G.limit : 0});
  ok ? Sound.ok() : Sound.bad();
  if (ok) popup('+' + pts);
  const sol = MathUtil.simpSteps(q.N, q.d);
  $('sch').innerHTML = simpPre(q) + chainHTML(timedOut ? sol.chain : S.chain, true);
  $('spanel').innerHTML = ''; setM('');
  $('pts').textContent = '⭐ ' + G.points; $('stk').textContent = '🔥 ' + G.streak;
  const R = q.res, rtxt = R.d === 1 ? '<b>' + R.n + '</b>' : frac(R.n, R.d);
  const msg = (ok ? '¡Muy bien! ' : timedOut ? '⏰ ¡Se acabó el tiempo! ' : 'Terminaste, pero con varios errores. ') +
    (q.w > 0 ? q.w + ' ' + q.n + '/' + q.d + ' = ' + q.N + '/' + q.d + ' = ' : q.n + '/' + q.d + ' = ') + rtxt +
    '<div class="small" style="margin-top:8px">' + (R.d === 1 ? 'El denominador llegó a 1: el resultado es un número entero.' : 'Ningún primo divide a la vez a ' + R.n + ' y a ' + R.d + ': es irreducible.') + '</div>';
  const fb = $('fb'); fb.className = 'fb ' + (ok ? 'good' : 'bad');
  fb.innerHTML = msg + '<div class="row"><button class="btn primary" id="next">' + (G.i + 1 >= G.qs.length ? 'Ver resultado' : 'Siguiente') + ' ➜</button></div>';
  const next = () => { G.i++; G.i >= G.qs.length ? viewSummary() : viewQuestion(); };
  $('next').onclick = next; $('next').focus();
  App.keys = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
}

/* ---------- Modo clase: simplificación paso a paso ---------- */
function viewClassSimp() {
  App.keys = null;
  const S = App.clsS = Object.assign({w: 2, n: 4, d: 8, s: 0, lvl: 2}, App.clsS || {});
  mount('<div class="topbar"><h2>🧑‍🏫 Modo clase</h2><span><button class="btn sm" id="fs">⛶ Pantalla completa</button> <button class="btn sm" id="back">← Salir</button></span></div>' + classTabs('simp') +
    '<div class="card"><div class="ctl" style="grid-template-columns:1fr 1fr 1fr 1.4fr 1fr">' +
    '<div><label for="sw" style="margin-top:0">Entero (0 = ninguno)</label><input type="number" id="sw" min="0" max="99"></div>' +
    '<div><label for="sn" style="margin-top:0">Numerador</label><input type="number" id="sn" min="1" max="999"></div>' +
    '<div><label for="sd" style="margin-top:0">Denominador</label><input type="number" id="sd" min="2" max="999"></div>' +
    '<div><label for="sl" style="margin-top:0">Nivel (aleatoria)</label><select id="sl"><option value="1">Nivel 1 · simples</option><option value="2">Nivel 2 · mixtas</option><option value="3">Nivel 3 · variado</option></select></div>' +
    '<div style="align-self:end"><button class="btn" id="sr" style="width:100%">🎲 Aleatoria</button></div></div><div class="err" id="serr"></div></div>' +
    '<div class="card"><div class="chain" id="sch" style="min-height:150px"></div>' +
    '<p class="center muted" id="sexp" style="max-width:none;margin:10px auto 0;font-size:19px;min-height:28px"></p>' +
    '<div class="row"><button class="btn" id="sprev">◀ Atrás</button><button class="btn primary" id="snext">Siguiente ▶</button><button class="btn" id="sall">Mostrar todo</button><button class="btn" id="srst">↺ Reiniciar</button></div>' +
    '<p class="muted small center" style="max-width:none;margin:10px auto 0">Números primos: 2 · 3 · 5 · 7 · 11 · 13 …  |  Teclas: → o espacio = siguiente, ← = atrás</p></div>', true);
  const $ = id => document.getElementById(id);
  let q, sol, base, total;
  const calc = () => { q = {w: S.w, n: S.n, d: S.d}; q.N = q.w * q.d + q.n; sol = MathUtil.simpSteps(q.N, q.d); base = q.w > 0 ? 1 : 0; total = base + 2 * sol.ps.length + 1; };
  const paint = () => {
    const fin = S.s === total, np = sol.ps.length;
    let html = simpPre(q, 'xl', S.s >= base), t = 0;
    if (S.s >= base) {
      t = Math.min(S.s - base, 2 * np);
      const shown = 1 + Math.floor(t / 2), ann = Math.ceil(t / 2);
      html += chainHTML(sol.chain.slice(0, shown).map((c, i) => ({n: c.n, d: c.d, p: i < ann ? c.p : 0})), fin, 'xl');
    }
    $('sch').innerHTML = html;
    const R = sol.res, p = sol.ps[Math.ceil(t / 2) - 1];
    $('sexp').textContent = (q.w > 0 && S.s === 0) ? 'Es una fracción mixta: primero la convertimos en fracción impropia.'
      : (q.w > 0 && S.s === 1) ? 'Multiplicamos ' + q.w + ' × ' + q.d + ' = ' + (q.w * q.d) + ' y sumamos ' + q.n + ': ' + q.N + '. El denominador pasa igual (' + q.d + ').'
      : fin ? (R.d === 1 ? 'El denominador llegó a 1: el resultado es el número entero ' + R.n + '.' : 'Ya no se puede simplificar: ' + R.n + '/' + R.d + ' es irreducible.')
      : t === 2 * np ? 'Revisamos los primos 2, 3, 5, 7…: ninguno divide a la vez al numerador y al denominador.'
      : t % 2 === 1 ? 'El ' + p + ' divide igual al numerador y al denominador: dividimos arriba y abajo.'
      : S.s === base ? 'Buscamos un primo que divida igual al numerador y al denominador.' : 'Nueva fracción. ¿Algún primo divide a los dos números?';
    $('sprev').disabled = S.s === 0; $('snext').disabled = fin;
  };
  const load = (w, n, d) => { S.w = w; S.n = n; S.d = d; S.s = 0; $('sw').value = w; $('sn').value = n; $('sd').value = d; calc(); paint(); };
  const parse = () => {
    const w = parseInt($('sw').value || '0', 10), n = parseInt($('sn').value, 10), d = parseInt($('sd').value, 10);
    if (!(w >= 0 && w <= 99 && n >= 1 && n <= 999 && d >= 2 && d <= 999)) return ($('serr').textContent = 'Entero de 0 a 99, numerador de 1 a 999 y denominador de 2 a 999.');
    $('serr').textContent = ''; S.w = w; S.n = n; S.d = d; S.s = 0; calc(); paint();
  };
  const step = d => { S.s = Math.max(0, Math.min(total, S.s + d)); paint(); };
  ['sw', 'sn', 'sd'].forEach(id => { $(id).addEventListener('input', parse); $(id).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }); });
  $('sl').value = S.lvl; $('sl').onchange = e => { S.lvl = +e.target.value; };
  $('sr').onclick = () => { const L = Config.SIMP.LEVELS[S.lvl], k = pick(L.kinds), r = Content.makeSimp(S.lvl, null, k); load(r.w, r.n, r.d); };
  $('snext').onclick = () => step(1); $('sprev').onclick = () => step(-1);
  $('sall').onclick = () => { S.s = total; paint(); }; $('srst').onclick = () => { S.s = 0; paint(); };
  App.keys = e => {
    if (e.key === ' ' && e.target && e.target.tagName === 'BUTTON') return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); step(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  };
  $('tabfig').onclick = viewClass; $('tabmcm').onclick = viewClassMcm; $('tabadd').onclick = viewClassAdd; $('tabdemo').onclick = viewDemo;
  $('fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) { /* no disponible */ } };
  $('back').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* ignorar */ } viewLogin(); };
  load(S.w, S.n, S.d);
}

const lastOf = c => c[c.length - 1];
/* ---------- Reto Suma con distinto denominador ---------- */
function addExprHTML(fr, cls, eq) {
  return fr.map((f, i) => (i ? '<span class="eq">+</span>' : '') + (f.w > 0 ? fracMixed(f.w, f.n, f.d, cls || 'lg') : frac(f.n, f.d, cls || 'lg'))).join('') + (eq === false ? '' : '<span class="eq">=</span>');
}
const nbox = x => '<span class="nbox">' + x + '</span>';
// Línea larga del pizarrón: numeradores arriba (sumando), una sola raya y el mcm debajo
const longFrac = (nums, L) => '<span class="lfrac"><span class="ln">' + nums.join('<span class="eq" style="font-size:30px;margin:0">+</span>') + '</span><span class="ld"><small>mcm</small><span class="nbox">' + L + '</span></span></span>';
const aIn = (id, w) => '<input type="number" inputmode="numeric" class="ain" id="' + id + '" style="width:' + (w || 84) + 'px">';
const aTarget = A => (A.phase === 'res' ? A.res : A.fr[A.fi]);

function viewAdd() {
  const G = App.game, q = G.qs[G.i];
  G.locked = false; G.t0 = performance.now(); G.limit = Config.TIME.addsub_unlike[G.level]; Music.setTension(G.timer ? 0 : 0.25);
  G.a = {phase: 'simp', fi: 0, er: 0, hn: 0, errs: {}, hintP: null, m: null, mcm: 0, res: null,
         fr: q.fr.map(f => ({w: f.w, n: f.n, d: f.d, phase: f.w > 0 ? 'conv' : 'simp', chain: f.w > 0 ? [] : [{n: f.n, d: f.d, p: 0}]}))};
  const head = '<div class="topbar"><span class="pill">' + Config.SKILLS.addsub_unlike.icon + ' ' + Config.LEVELS[G.level].name + ' · Ejercicio ' + (G.i + 1) + ' de ' + G.qs.length + '</span>' +
    '<span><span class="pill" id="pts">⭐ ' + G.points + '</span> <span class="pill" id="stk">🔥 ' + G.streak + '</span> <button class="btn" id="quit">Salir</button></span></div>' +
    '<div class="bar"><i style="width:' + (G.i / G.qs.length * 100) + '%"></i></div>' +
    (G.timer ? '<div class="tbar"><i id="tb"></i><span id="tt"></span></div>' : '');
  mount(head + '<div class="card"><div class="prompt">Suma las fracciones</div><div class="chain" id="aexp" style="min-height:0"></div><div class="stps" id="asteps"></div>' +
    '<div id="asec"></div><div class="mmsg" id="mmsg"></div><div class="fb hidden" id="fb"></div></div>', false, true);
  document.getElementById('quit').onclick = () => askConfirm('¿Salir de la ronda?', exitGame, 'Sí, salir');
  document.getElementById('aexp').innerHTML = addExprHTML(q.fr, 'lg', false);
  App.keys = e => {
    const A = G.a; if (G.locked) return; const n = parseInt(e.key, 10);
    if (A.phase === 'simp' || A.phase === 'res') { if ([2, 3, 5, 7].includes(n)) aPrime(n); else if (e.key === '0') aStop(); }
    else if (A.phase === 'mcm' && A.m.phase === 'div' && [2, 3, 5, 7].includes(n)) aMcmChoose(n);
  };
  renderA();
  if (G.timer) startTimer(G);
}

function renderA(msg, kind) {
  const G = App.game, q = G.qs[G.i], A = G.a, $ = id => document.getElementById(id);
  const names = ['Simplificar', 'Calcular el mcm', 'Plantilla', 'Sumar'], cur = {simp: 0, mcm: 1, tmpl: 2, sum: 3, res: 3}[A.phase];
  $('asteps').innerHTML = names.map((n, i) => '<span class="stp ' + (i < cur ? 'ok' : i === cur ? 'on' : '') + '">' + (i < cur ? '✔ ' : '') + 'Paso ' + (i + 1) + ': ' + n + '</span>').join('');
  const dens = A.fr.map(f => lastOf(f.chain) ? lastOf(f.chain).d : f.d);
  const redExpr = () => addExprHTML(A.fr.map(f => ({w: 0, n: lastOf(f.chain).n, d: lastOf(f.chain).d})), 'lg', false);
  let h = '', p = '', hint = true;
  const primePanel = (t, label) => '<p class="muted center" style="margin:6px 0 10px;max-width:none">' + label + '</p>' +
    '<div class="pbtns">' + Config.SIMP.PRIMES.map(x => '<button class="pbtn' + (A.hintP === x ? ' hint' : '') + '" data-p="' + x + '">' + x + '</button>').join('') + '</div>' +
    '<div class="row"><button class="btn ok sstop" id="astop">✋ Ya no se puede simplificar</button></div>';
  if (A.phase === 'simp') {
    A.fr.forEach((f, i) => {
      if (i > A.fi) return;
      const pre = f.w > 0 ? fracMixed(f.w, f.n, f.d, 'lg') + '<span class="eq">=</span>' : '';
      h += '<div class="chain" style="min-height:70px">' + pre + (f.phase === 'conv'
        ? '<span class="frac lg"><span class="n"><input type="number" class="ain" id="acin" inputmode="numeric" aria-label="Nuevo numerador"></span><span class="d">' + f.d + '</span></span>'
        : chainHTML(f.chain, f.phase === 'done')) + '</div>';
    });
    const t = aTarget(A);
    p = t.phase === 'conv' ? '<p class="muted center" style="max-width:none"><b>Fracción ' + (A.fi + 1) + ' de ' + A.fr.length + '.</b> Multiplica el entero por el denominador y suma el numerador. El denominador se queda igual.</p><div class="row"><button class="btn primary" id="achk">Comprobar ✔</button></div>'
      : primePanel(t, '<b>Fracción ' + (A.fi + 1) + ' de ' + A.fr.length + '.</b> ¿Algún primo divide igual al numerador y al denominador? Si no, detecta que ya no se puede simplificar.');
  } else if (A.phase === 'mcm') {
    const M = A.m, last = M.rows[M.rows.length - 1];
    h = '<div class="chain" style="min-height:60px">' + redExpr() + '</div><p class="prompt" style="font-size:20px;margin:4px 0">Calcula el mcm de <b>' + dens.join(', ') + '</b></p>' +
        '<div class="mstage">' + mtableHTML(M.rows, M.divs, M.phase === 'fill' ? last.map(x => x > 1) : 0) + '</div>';
    if (M.phase === 'div') p = '<p class="muted center" style="margin:0 0 10px;max-width:none"><b>Paso ' + (M.divs.length + 1) + '.</b> Elige el primo más pequeño que divide al menos a uno de los números.</p><div class="pbtns">' +
        Config.MCM.PRIMES.map(x => '<button class="pbtn' + (M.hintP === x ? ' hint' : '') + '" data-p="' + x + '">' + x + '</button>').join('') + '</div>';
    else if (M.phase === 'fill') p = '<p class="muted center" style="margin:0 0 10px;max-width:none">Dividiste entre <b>' + M.divs[M.divs.length - 1] + '</b>. Escribe la nueva fila: divide y <b>baja</b> los que no se pueden dividir.</p><div class="row"><button class="btn primary" id="achk">Comprobar ✔</button></div>';
    else p = '<p class="muted center" style="margin:0 0 10px;max-width:none">¡Todos son 1! Multiplica los divisores.</p><div class="mformula">mcm = ' + M.divs.join(' × ') + ' = ' + aIn('aprod', 110) + '</div><div class="row"><button class="btn primary" id="achk">Comprobar ✔</button></div>';
  } else if (A.phase === 'tmpl') {
    h = '<div class="chain" style="min-height:90px">' + redExpr() + '<span class="eq">=</span>' + longFrac(A.fr.map((f, i) => aIn('tp' + i, 96)), A.mcm) + '</div>' +
        '<div class="trow" style="font-size:20px;margin:2px 0 8px">Cada numerador: el mcm (<b>' + A.mcm + '</b>) <span class="op">÷</span> el denominador <span class="op">×</span> el numerador</div>';
    p = '<div class="row"><button class="btn primary" id="achk">Comprobar ✔</button></div>';
  } else if (A.phase === 'sum') {
    h = '<div class="chain" style="min-height:90px">' + redExpr() + '<span class="eq">=</span>' + longFrac(q.sol.prods.map(nbox), A.mcm) + '<span class="eq">=</span>' +
        '<span class="frac lg"><span class="n">' + aIn('asum', 120) + '</span><span class="d">' + A.mcm + '</span></span></div>';
    p = '<p class="muted center" style="max-width:none">Ejecuta la suma de los numeradores y pasa el mcm (el denominador se queda igual).</p><div class="row"><button class="btn primary" id="achk">Comprobar ✔</button></div>';
  } else if (A.phase === 'res') {
    h = '<div class="chain" style="min-height:90px">' + redExpr() + '<span class="eq">=</span>' + longFrac(q.sol.prods.map(nbox), A.mcm) + '<span class="eq">=</span>' + chainHTML(A.res.chain, false) + '</div>';
    p = primePanel(A.res, '<b>Resultado.</b> ¿Se puede simplificar? Déjalo como fracción impropia (no la conviertas a mixta).');
  }
  if (A.phase !== 'done') p += '<div class="row"><button class="btn sm" id="ahint">💡 Pista (-3 pts)</button></div>';
  $('asec').innerHTML = h + p; setM(msg, kind);
  document.querySelectorAll('#asec .pbtn').forEach(b => b.onclick = () => (A.phase === 'mcm' ? aMcmChoose(+b.dataset.p) : aPrime(+b.dataset.p)));
  if ($('achk')) $('achk').onclick = aEnter;
  if ($('astop')) $('astop').onclick = aStop;
  if ($('ahint')) $('ahint').onclick = aHint;
  document.querySelectorAll('#asec input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); aEnter(); } }));
  const f0 = document.querySelector('#asec input'); if (f0) f0.focus();
}

function aEnter() {
  const G = App.game, A = G.a; if (G.locked) return;
  if (A.phase === 'simp' && A.fr[A.fi].phase === 'conv') aConv();
  else if (A.phase === 'mcm') { if (A.m.phase === 'fill') aMcmRow(); else if (A.m.phase === 'prod') aMcmProd(); }
  else if (A.phase === 'tmpl') aTmpl();
  else if (A.phase === 'sum') aSum();
}

function aConv() {
  const A = App.game.a, f = A.fr[A.fi], v = parseInt(document.getElementById('acin').value, 10), N = f.w * f.d + f.n;
  if (v === N) { f.phase = 'simp'; f.chain = [{n: N, d: f.d, p: 0}]; Sound.ok(); return renderA('✔ ' + f.w + ' × ' + f.d + ' + ' + f.n + ' = ' + N + '. Ahora revisa si se puede simplificar.', 'good'); }
  A.er++; Sound.bad(); const t = v === f.w * f.d ? 'noadd' : 'conv'; A.errs[t] = (A.errs[t] || 0) + 1;
  setM(t === 'noadd' ? '❌ Ya multiplicaste ' + f.w + ' × ' + f.d + ' = ' + (f.w * f.d) + '. Falta sumar el numerador.' : '❌ Revisa: primero multiplica ' + f.w + ' × ' + f.d + ' y después suma ' + f.n + '.', 'bad');
}

function aPrime(p) {
  const G = App.game, A = G.a; if (G.locked || (A.phase !== 'simp' && A.phase !== 'res')) return;
  const t = aTarget(A); if (t.phase !== 'simp') return;
  const cur = lastOf(t.chain), a = cur.n % p === 0, b = cur.d % p === 0;
  if (!(a && b)) { A.er++; A.errs.sprime = (A.errs.sprime || 0) + 1; setM(''); return alertBadPrime(p, cur.n, cur.d); }
  cur.p = p; t.chain.push({n: cur.n / p, d: cur.d / p, p: 0}); A.hintP = null; Sound.beep(700, 0.08);
  renderA('✔ ' + cur.n + ' ÷ ' + p + ' = ' + (cur.n / p) + ' y ' + cur.d + ' ÷ ' + p + ' = ' + (cur.d / p) + '. ¿Se puede seguir?', 'good');
}

function aStop() {
  const G = App.game, A = G.a; if (G.locked || (A.phase !== 'simp' && A.phase !== 'res')) return;
  const t = aTarget(A); if (t.phase !== 'simp') return;
  const cur = lastOf(t.chain), g = MathUtil.gcd(cur.n, cur.d);
  if (g > 1) { A.er++; A.errs.early = (A.errs.early || 0) + 1; setM(''); return alertEarly(cur.n, cur.d, A.errs.early >= 2 ? MathUtil.spf(g) : 0); }
  t.phase = 'done'; A.hintP = null; Sound.ok();
  if (A.phase === 'res') return finalizeAdd(false);
  const why = '✔ ' + cur.n + '/' + cur.d + ': ningún primo divide a la vez a ' + cur.n + ' y a ' + cur.d + '.';
  if (++A.fi < A.fr.length) return renderA(why, 'good');
  A.phase = 'mcm'; A.m = {rows: [A.fr.map(f => lastOf(f.chain).d)], divs: [], phase: 'div', rowErr: 0, hintP: null};
  renderA('✔ Paso 1 completo. Ahora calcula el mcm de los denominadores.', 'good');
}

function aMcmChoose(p) {
  const G = App.game, A = G.a, M = A.m; if (G.locked || A.phase !== 'mcm' || M.phase !== 'div') return;
  const last = M.rows[M.rows.length - 1];
  if (!last.some(x => x > 1 && x % p === 0)) { A.er++; A.errs.prime = (A.errs.prime || 0) + 1; Sound.bad(); return setM('❌ ' + p + ' no divide a ninguno de los números de la fila. Prueba con otro primo.', 'bad'); }
  const small = MathUtil.smallestDivisor(last);
  M.divs.push(p); M.phase = 'fill'; M.hintP = null; M.rowErr = 0;
  renderA(p !== small ? 'Funciona, pero normalmente empezamos con el primo más pequeño (' + small + ').' : '', 'tip');
}
function aMcmRow() {
  const G = App.game, A = G.a, M = A.m, last = M.rows[M.rows.length - 1], p = M.divs[M.divs.length - 1], exp = MathUtil.nextRow(last, p), wrong = [];
  exp.forEach((v, i) => { if (v === null) return; const el = document.getElementById('mi' + i), s = el.value.trim(), ok = s !== '' && parseInt(s, 10) === v; el.classList.toggle('bad', !ok); el.classList.toggle('good', ok); if (!ok) wrong.push(i); });
  if (!wrong.length) { M.rows.push(exp); M.phase = MathUtil.rowDone(exp) ? 'prod' : 'div'; M.rowErr = 0; Sound.ok(); return renderA('✔ ¡Bien!', 'good'); }
  A.er++; M.rowErr++; Sound.bad();
  const types = new Set(wrong.map(i => (last[i] % p === 0 ? 'div' : 'down'))); types.forEach(t => { A.errs[t] = (A.errs[t] || 0) + 1; });
  let msg = types.has('down') ? '❌ Si un número no se puede dividir entre ' + p + ', se baja igual.' : '❌ Revisa la división en las casillas rojas.';
  if (M.rowErr >= 2) msg += ' Ayuda: ' + last.filter(x => x > 1).map(x => (x % p === 0 ? x + ' ÷ ' + p + ' = ' + (x / p) : x + ' se baja')).join(' · ');

function aMcmProd() {

function aTmpl() {

  });
  if (!bad) { A.phase = 'sum'; Sound.ok(); return renderA('✔ ¡Numeradores correctos! Ahora ejecuta la suma.', 'good'); }
  A.er++; Sound.bad(); kinds.forEach(k => { A.errs[k] = (A.errs[k] || 0) + 1; });
  setM(kinds.has('factor') ? '❌ Revisa las casillas rojas: divide el mcm (' + A.mcm + ') entre el denominador y el resultado multiplícalo por el numerador.' : '❌ Ya dividiste el mcm entre el denominador; ahora multiplica por el numerador.', 'bad');
}
function aSum() {

function aHint() {
  const G = App.game, q = G.qs[G.i], A = G.a; if (G.locked) return; A.hn++;

    const cur = lastOf(t.chain), g = MathUtil.gcd(cur.n, cur.d);
    if (g > 1) { A.hintP = MathUtil.spf(g); return renderA('💡 Prueba con el ' + A.hintP + ': divide a ' + cur.n + ' y a ' + cur.d + '.', 'tip'); }

function finalizeAdd(timedOut) {

  $('mn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  App.keys = e => {
    if (e.key === ' ' && e.target && e.target.tagName === 'BUTTON') return;   // el botón enfocado ya reacciona a la barra espaciadora
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); step(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  };
  $('tabfig').onclick = viewClass; $('tabsimp').onclick = viewClassSimp; $('tabadd').onclick = viewClassAdd; $('tabdemo').onclick = viewDemo;
  $('fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) { /* no disponible */ } };
  $('back').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* ignorar */ } viewLogin(); };
  load(S.nums);
}

/* ---------- Zona docente ---------- */
function viewTeacher() {
  App.keys = null;
  const groups = [...new Set(App.store.students().map(s => s.group))].sort();
  const sel = App.teacherGroup || '';
  const rows = App.store.students().filter(s => !sel || s.group === sel)
    .sort((a, b) => a.group.localeCompare(b.group) || a.id - b.id).map(s => {
      const recs = App.store.records(r => r.sk === s.key), sk = Analytics.bySkill(recs), al = Analytics.alerts(recs), S = Analytics.summary(recs);
      const tot = recs.length ? pct(S.acc) : '—';
      const badges = recs.length < Config.ALERTS.minAttempts ? '<span class="muted small">Pocos datos</span>'
        : (al.length ? al.map(a => '<span class="badge ' + a.level + '" title="' + esc(a.text) + '">' + esc(a.text) + '</span>').join('') : '<span class="badge ok">Sin alertas</span>');
      return '<tr class="st" data-k="' + esc(s.key) + '"><td>' + esc(s.group) + '</td><td>' + s.id + '</td><td>' + (s.name ? esc(s.name) : '<span class="muted">—</span>') + '</td><td>' + recs.length + '</td><td>' + tot + '</td>' +
        '<td>' + (sk.identify ? pct(sk.identify.acc) : '—') + '</td><td>' + (sk.color ? pct(sk.color.acc) : '—') + '</td><td>' + (sk.mcm ? pct(sk.mcm.acc) : '—') + '</td><td>' + (sk.simplify ? pct(sk.simplify.acc) : '—') + '</td><td>' + (sk.addsub_unlike ? pct(sk.addsub_unlike.acc) : '—') + '</td><td>' + (recs.length ? secs(S.avgMs) : '—') + '</td><td>' + (s.points || 0) + '</td><td>' + fmtDate(s.lastSeen) + '</td><td>' + badges + '</td></tr>';
    }).join('');
  const planned = Object.keys(Config.SKILLS).filter(k => !Config.SKILLS[k].active).map(k => Config.SKILLS[k].icon + ' ' + Config.SKILLS[k].name).join(' · ');
  const rg = sel || Prefs.get('lastGroup', '') || groups[0] || '', nS = App.store.students().length, nR = App.store.records().length;
  mount('<div class="topbar"><h2>Zona docente</h2><span><button class="btn" id="cls">🧑‍🏫 Modo clase</button> ' + (Cloud.on ? '<button class="btn" id="rfr">🔄 Actualizar</button> <button class="btn" id="tout">Cerrar sesión (' + esc((Cloud.T || {}).email || '') + ')</button> ' : '') + '<button class="btn" id="back">← Volver</button></span></div>' +
    (Cloud.on ? groupsCard() + groupSummary(sel) : '') +
    (App.store.persistent ? '' : '<div class="card" style="background:#fef3c7">Este navegador no permite guardar datos; el progreso se perderá al cerrar. Abre el archivo desde una carpeta del equipo.</div>') +
    '<div class="card"><h3>👥 Lista de alumnos</h3>' +
    '<p class="muted small" style="max-width:none">Pega o escribe un alumno por renglón: <b>Nombre</b> (se numera en orden), o <b>3. Nombre</b> si quieres fijar el número de lista. También puedes cargar un archivo .txt o .csv (<i>grupo;número;nombre</i>). Si el alumno ya existe, conserva sus puntos y resultados.' + (Cloud.on ? ' <b>Los nombres se guardan solo en este equipo, nunca en la nube.</b>' : '') + '</p>' +
    '<div class="row left" style="margin:0 0 8px"><label for="rgrp" style="margin:0">Grupo</label><input type="text" id="rgrp" maxlength="6" style="width:110px" value="' + esc(rg) + '" placeholder="1F"> ' +
    '<button class="btn" id="rload">📂 Cargar archivo</button><input type="file" id="rfile" accept=".txt,.csv,text/plain,text/csv" class="hidden"></div>' +
    '<textarea id="rtxt" rows="7" style="width:100%;font-size:17px;padding:10px;border:2px solid var(--line);border-radius:12px;font-family:inherit" placeholder="1. Ana Pérez&#10;2. Luis Gómez&#10;…"></textarea>' +
    '<div class="err" id="rerr"></div><div class="row left"><button class="btn primary" id="rsave">Guardar lista</button></div></div>' +
    '<div class="card"><div class="row left" style="margin:0 0 10px">' +
    '<span class="pill" id="savedpill">' + (Cloud.on ? '☁️ Nube · ' : '💾 Guardado automático · ') + nS + ' alumnos · ' + nR + ' resultados' + (App.store.savedAt ? ' · ' + new Date(App.store.savedAt).toLocaleTimeString('es-MX', {hour: '2-digit', minute: '2-digit'}) : '') + '</span>' +
    '<select id="gsel" style="width:auto"><option value="">Todos los grupos</option>' + groups.map(g => '<option' + (g === sel ? ' selected' : '') + '>' + esc(g) + '</option>').join('') + '</select>' +
    '<button class="btn" id="ej">Exportar JSON</button><button class="btn" id="ec">Exportar CSV</button>' +
    '<button class="btn" id="imp">Importar JSON</button><input type="file" id="file" accept=".json" class="hidden">' +
    '<button class="btn" id="clr" style="color:var(--bad)">Borrar todo</button></div>' +
    '<div class="scroll"><table><thead><tr><th>Grupo</th><th>Lista</th><th>Nombre</th><th>Intentos</th><th>Aciertos</th><th>Identifica</th><th>Colorea</th><th>MCM</th><th>Simplifica</th><th>Suma</th><th>Tiempo prom.</th><th>Puntos</th><th>Última vez</th><th>Alertas tempranas</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="14" class="muted">Aún no hay alumnos registrados.</td></tr>') + '</tbody></table></div>' +
    '<p class="muted small">Toca un alumno para ver el detalle por denominador, figura, nivel y tipos de error frecuentes. ' + (Cloud.on ? 'Los resultados de todos los dispositivos se reúnen solos en la nube; usa «Actualizar» para traer lo más reciente.' : 'Para reunir datos de varias computadoras: exporta JSON en cada una e impórtalos aquí.') + '</p></div>' +
    '<div id="detail"></div>' +
    '<div class="card"><h3>Hoja de ruta</h3><p class="muted">Siguientes retos del juego: ' + planned + '.</p></div>', true);
  document.getElementById('back').onclick = () => (App.user ? viewMenu() : viewLogin());
  document.getElementById('cls').onclick = viewClass;
  if (Cloud.on) {
    bindGroupsCard();
    ['imp', 'clr', 'file'].forEach(id => { document.getElementById(id).style.display = 'none'; });
    document.getElementById('rfr').onclick = enterTeacher;
    document.getElementById('tout').onclick = () => { Cloud.tClear(); App.store = App.studentStore; viewLogin(); };
  }
  const $r = id => document.getElementById(id);
  const fillRoster = () => { $r('rtxt').value = Roster.toText(App.store.roster(normGroup($r('rgrp').value))); };
  fillRoster();
  $r('rgrp').onchange = fillRoster;
  $r('rload').onclick = () => $r('rfile').click();
  $r('rfile').onchange = e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { $r('rtxt').value = String(fr.result).replace(/^\uFEFF/, ''); }; fr.readAsText(f); };
  $r('rsave').onclick = () => {
    const g = normGroup($r('rgrp').value);
    if (!g) return ($r('rerr').textContent = 'Escribe el grupo.');
    const R = Roster.parse($r('rtxt').value, g);
    if (R.errors.length) return ($r('rerr').textContent = R.errors.slice(0, 3).join(' '));
    if (!R.list.length) return ($r('rerr').textContent = 'Escribe al menos un alumno.');
    const now = Date.now();
    App.store.upsertMany(R.list.map(a => { const key = a.group + '-' + a.id; return App.store.student(key) ? {key, name: a.name} : {key, group: a.group, id: a.id, name: a.name, points: 0, bestStreak: 0, created: now}; }));
    Prefs.set('lastGroup', g); App.teacherGroup = g;
    viewTeacher(); notice('Lista guardada: ' + R.list.length + ' alumnos en ' + g + '.');
  };
  document.getElementById('gsel').onchange = e => { App.teacherGroup = e.target.value; viewTeacher(); };
  document.getElementById('ej').onclick = () => saveFile('fraclab-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(App.store.exportAll()), 'application/json');
  document.getElementById('ec').onclick = () => {
    const nm = {}; App.store.students().forEach(x => { nm[x.key] = x.name || ''; });
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const head = ['grupo', 'lista', 'nombre', 'fecha', 'ronda', 'habilidad', 'nivel', 'figura', 'numerador', 'denominador', 'correcta', 'ms', 'tiempo_agotado', 'error', 'numeros_mcm', 'errores', 'pistas', 'entero', 'resultado', 'ejercicio'];
    const lines = App.store.records().map(r => [r.g, r.st, q(nm[r.sk] || ''), new Date(r.ts).toISOString(), r.rd || '', r.skill, r.lvl, r.shape || '', r.n == null ? '' : r.n, r.d == null ? '' : r.d, r.ok ? 1 : 0, r.ms, r.to ? 1 : 0, r.err || '', r.nums ? r.nums.join('|') : '', r.er || 0, r.hn || 0, r.w || '', r.res || '', q(r.ex || '')].join(','));
    saveFile('fraclab-' + new Date().toISOString().slice(0, 10) + '.csv', '﻿' + head.join(',') + '\n' + lines.join('\n'), 'text/csv');
  };
  document.getElementById('imp').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const n = App.store.importAll(JSON.parse(rd.result)); viewTeacher(); notice('Importados ' + n + ' registros nuevos.'); } catch (err) { notice('No se pudo importar: ' + err.message); } };
    rd.readAsText(f);
  };
  document.getElementById('clr').onclick = () => askConfirm('¿Borrar TODOS los alumnos y resultados de este equipo?', () => askConfirm('Esta acción no se puede deshacer. ¿Continuar?', () => { App.store.clearAll(); viewTeacher(); }, 'Sí, borrar todo'));
  document.querySelectorAll('tr.st').forEach(tr => tr.onclick = () => showDetail(tr.dataset.k));
}

function showDetail(key) {
  const s = App.store.student(key), recs = App.store.records(r => r.sk === key);
  const den = Analytics.byDenominator(recs), errs = Analytics.errorTypes(recs), al = Analytics.alerts(recs), S = Analytics.summary(recs);
  const sh = Analytics.byShape(recs), lv = Analytics.byLevel(recs);
  const dRows = Object.keys(den).sort((a, b) => a - b).map(d => '<tr><td>' + d + '</td><td>' + den[d].a + '</td><td>' + pct(den[d].c / den[d].a) + '</td></tr>').join('');
  const eRows = Object.keys(errs).sort((a, b) => errs[b] - errs[a]).map(k => '<li>' + esc(Config.ERR_LABELS[k] || k) + ' (' + errs[k] + ')</li>').join('');
  const sr = recs.filter(r => r.skill === 'simplify');
  const simpBlock = sr.length ? '<div style="margin-top:12px"><b>Reto Simplifica</b><p class="muted small">Fracciones: ' + sr.length + ' · errores por fracción: ' + (sr.reduce((t, r) => t + (r.er || 0), 0) / sr.length).toFixed(1) +
    ' · pistas: ' + sr.reduce((t, r) => t + (r.hn || 0), 0) + '</p><div>' +
    sr.slice(-12).map(r => '<span class="badge ' + (r.ok ? 'ok' : r.to ? 'med' : 'high') + '">' + (r.w ? r.w + ' ' : '') + r.n + '/' + r.d + ' → ' + r.res + (r.er ? ' (' + r.er + ' err.)' : '') + '</span>').join('') + '</div></div>' : '';
  const ar = recs.filter(r => r.skill === 'addsub_unlike');
  const addBlock = ar.length ? '<div style="margin-top:12px"><b>Reto Suma</b><p class="muted small">Ejercicios: ' + ar.length + ' · errores por ejercicio: ' + (ar.reduce((t, r) => t + (r.er || 0), 0) / ar.length).toFixed(1) +
    ' · pistas: ' + ar.reduce((t, r) => t + (r.hn || 0), 0) + '</p><div>' +
    ar.slice(-8).map(r => '<span class="badge ' + (r.ok ? 'ok' : r.to ? 'med' : 'high') + '">' + esc(r.ex) + ' = ' + r.res + (r.er ? ' (' + r.er + ' err.)' : '') + '</span>').join('') + '</div></div>' : '';
  const mr = recs.filter(r => r.skill === 'mcm');
  const mcmBlock = mr.length ? '<div style="margin-top:12px"><b>Reto MCM</b><p class="muted small">Colecciones: ' + mr.length + ' · errores por colección: ' + (mr.reduce((t, r) => t + (r.er || 0), 0) / mr.length).toFixed(1) +
    ' · pistas: ' + mr.reduce((t, r) => t + (r.hn || 0), 0) + '</p><div>' +
    mr.slice(-12).map(r => '<span class="badge ' + (r.ok ? 'ok' : r.to ? 'med' : 'high') + '">' + r.nums.join(', ') + ' → ' + r.mcm + (r.er ? ' (' + r.er + ' err.)' : '') + '</span>').join('') + '</div></div>' : '';
  document.getElementById('detail').innerHTML = '<div class="card"><h3>' + (s.name ? esc(s.name) + ' · ' : '') + 'Lista ' + s.id + ' · ' + esc(s.group) + '</h3>' +
    '<p class="muted">Rondas: ' + S.rounds + ' · Aciertos: ' + (S.a ? pct(S.acc) : '—') + ' · Tiempo promedio: ' + (S.a ? secs(S.avgMs) : '—') + ' · Tiempos agotados: ' + S.timeouts + '</p>' +
    (al.length ? '<p>' + al.map(a => '<span class="badge ' + a.level + '">' + esc(a.text) + '</span>').join('') + '</p>' : '') +
    '<div class="grid2"><div><b>Aciertos por denominador</b><table><thead><tr><th>Denominador</th><th>Intentos</th><th>Aciertos</th></tr></thead><tbody>' + (dRows || '<tr><td colspan="3" class="muted">Sin datos</td></tr>') + '</tbody></table></div>' +
    '<div><b>Errores frecuentes</b><ul>' + (eRows || '<li class="muted">Sin errores registrados</li>') + '</ul></div></div>' +
    '<div class="grid2" style="margin-top:12px"><div><b>Por figura</b>' + Object.keys(sh).map(k => meter(shapeName(k), sh[k])).join('') + '</div>' +
    '<div><b>Por nivel</b>' + Object.keys(lv).sort().map(k => meter('Nivel ' + k, lv[k])).join('') + '</div></div>' + mcmBlock + simpBlock + addBlock +
    '<div class="row left" style="margin-top:12px">' + (Cloud.on ? '<span class="muted small" style="align-self:center">NIP: ' + (s.hasPin ? 'creado' : 'sin crear') + (s.lockedUntil > Date.now() ? ' · 🔒 bloqueado' : '') + '</span>' + (s.dbId && s.hasPin ? '<button class="btn" id="rstpin">🔑 Reiniciar NIP</button>' : '') : '') + '<button class="btn" id="rmst" style="color:var(--bad)">Quitar alumno y sus resultados</button></div></div>';
  document.getElementById('rmst').onclick = () => askConfirm('¿Quitar a ' + (s.name || 'lista ' + s.id) + ' y borrar sus ' + recs.length + ' resultados?', async () => {
    if (Cloud.on && s.dbId) { const r = await Cloud.tReq('DELETE', '/rest/v1/students?id=eq.' + s.dbId).catch(e => ({ok: false})); if (!r.ok) return notice('No se pudo borrar en la nube.'); }
    App.store.removeStudent(key); viewTeacher();
  }, 'Sí, quitar');
  const rp = document.getElementById('rstpin');
  if (rp) rp.onclick = () => askConfirm('¿Reiniciar el NIP de ' + (s.name || 'lista ' + s.id) + '? Al entrar tendrá que crear uno nuevo.', async () => {
    const r = await Cloud.tReq('POST', '/rest/v1/rpc/teacher_reset_pin', {p_student: s.dbId}).catch(e => ({ok: false}));
    if (!r.ok) return notice('No se pudo reiniciar el NIP.');
    await enterTeacher(); notice('NIP reiniciado. La próxima vez que entre, creará uno nuevo.');
  }, 'Sí, reiniciar');
  document.getElementById('detail').scrollIntoView({behavior: 'smooth'});
}

/* ---------- Arranque ---------- */
function boot() {
  Cloud.init();
  App.store = App.studentStore = Cloud.on ? new ApiStore() : new LocalStore();
  Sound.on = Prefs.get('sound', true);
  Music.on = Prefs.get('music', true);
  document.addEventListener('visibilitychange', () => { try { if (Sound.ctx) document.hidden ? Sound.ctx.suspend() : Sound.ctx.resume(); } catch (e) { /* sin audio */ } });
  App.timerOn = Prefs.get('timer', true);
  document.addEventListener('keydown', e => { if (App.keys && !document.querySelector('.modal') && !/INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '')) App.keys(e); });
  viewLogin();
}
if (typeof document !== 'undefined') boot();
</script>
</body>
</html>
